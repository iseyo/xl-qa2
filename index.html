<!doctype html>
<html lang="zh-CN">

  <meta charset="utf-8" />

  <title>一、单项选择题 以下备选项只有一项符合题目要求，不选，错选均不得分。 - 学习练习</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #65717f;
      --line: #dfe4ea;
      --primary: #1769aa;
      --primary-strong: #0d4f86;
      --accent: #0f8b6f;
      --warn: #b86b00;
      --danger: #b84242;
      --ok-bg: #e8f6f1;
      --bad-bg: #faecec;
      --shadow: 0 14px 32px rgba(20, 31, 44, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    button, input, select { font: inherit; }
    .app-shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }
    .topbar {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 18px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    .top-actions { position: relative; flex: 0 0 auto; }
    .menu-button {
      min-width: 52px;
      height: 44px;
      padding: 9px 12px;
      font-size: 15px;
      line-height: 1;
    }
    .action-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 60;
      display: none;
      width: 190px;
      padding: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(20, 31, 44, .16);
    }
    .action-menu.open { display: grid; gap: 6px; }
    .action-menu .btn {
      justify-content: flex-start;
      width: 100%;
    }
    .brand h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); letter-spacing: 0; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    main {
      width: min(900px, 100%);
      margin: 0 auto;
      padding: 18px;
      display: block;
    }
    aside, .question-panel, .review-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .settings-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(12, 20, 31, .42);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }
    body.settings-open .settings-backdrop {
      opacity: 1;
      pointer-events: auto;
    }
    aside {
      position: fixed;
      z-index: 50;
      top: 50%;
      left: 50%;
      width: min(420px, calc(100vw - 24px));
      max-height: min(680px, calc(100vh - 32px));
      padding: 14px;
      overflow: auto;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -46%) scale(.96);
      transition: opacity .16s ease, transform .18s ease;
    }
    body.settings-open aside {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .section-title { margin: 4px 0 10px; font-size: 14px; color: var(--muted); font-weight: 700; }
    .field { display: grid; gap: 6px; margin-bottom: 12px; }
    label { color: var(--muted); font-size: 13px; }
    select, input[type="search"], input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      background: #fff;
      color: var(--text);
      min-height: 42px;
    }
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .jump-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      min-height: 40px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: .16s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover { border-color: #9fb4c8; transform: translateY(-1px); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-strong); }
    .btn.active { border-color: var(--primary); color: var(--primary); background: #eef6fc; }
    .btn.warn { color: var(--warn); }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 14px 0;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfd;
    }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .progress {
      height: 9px;
      background: #e9edf2;
      border-radius: 999px;
      overflow: hidden;
      margin: 6px 0 14px;
    }
    .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--primary)); }
    .question-panel { padding: 18px; min-height: 520px; }
    .q-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 9px;
      background: #fbfcfd;
    }
    .stem { margin: 16px 0; font-size: clamp(18px, 2.5vw, 24px); font-weight: 750; }
    .options { display: grid; gap: 10px; margin: 16px 0; }
    .option {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 13px;
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 10px;
      text-align: left;
      cursor: pointer;
      min-height: 56px;
    }
    .option .key {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      background: #edf1f5;
      font-weight: 800;
    }
    .option.selected { border-color: var(--primary); background: #eef6fc; }
    .option.correct { border-color: var(--accent); background: var(--ok-bg); }
    .option.wrong { border-color: var(--danger); background: var(--bad-bg); }
    .answer-box {
      display: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfd;
      margin-top: 14px;
    }
    .answer-box.show { display: block; }
    .answer-line { margin: 0 0 8px; font-weight: 800; }
    .knowledge { margin: 0; color: var(--muted); font-size: 14px; }
    .analysis {
      margin: 10px 0 0;
      color: var(--text);
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .nav-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
    .spacer { flex: 1; }
    .review-panel { margin-top: 18px; padding: 14px; display: none; }
    .review-panel.show { display: block; }
    .review-list { display: grid; gap: 8px; max-height: 360px; overflow: auto; }
    .review-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      cursor: pointer;
    }
    .review-item b { color: var(--danger); }
    .empty {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fbfcfd;
    }
    @media (max-width: 840px) {
      .topbar { align-items: flex-start; }
      main { padding: 12px; }
      .question-panel { padding: 14px; min-height: auto; }
      .stem { font-size: 19px; }
      .option { grid-template-columns: 34px 1fr; padding: 12px; }
      .btn { flex: 1 1 auto; }
      .nav-row .spacer { display: none; }
    }
    @media (max-width: 480px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .mode-grid { grid-template-columns: 1fr; }
      .jump-row { grid-template-columns: 1fr; }
      .topbar { padding: 12px; }
      .brand h1 { font-size: 21px; }
      .q-meta { font-size: 12px; }
      aside {
        width: calc(100vw - 24px);
        max-height: calc(100vh - 48px);
      }
    }

  <script id="quizData" type="application/json">[{"number":1,"type":"单选题","stem":"《证券法》以证券市场各类参与主体为适用对象，其核心旨在（ ）。","options":[{"key":"A","text":"保护投资者的合法权益，维护社会经济秩序和社会公共利益"},{"key":"B","text":"扩大市场规模，为银行业改革服务"},{"key":"C","text":"打击各种金融犯罪，为反洗钱工作提供法律保障"},{"key":"D","text":"为资源配置功能的发挥提供法律保障，提高保险业公司质量"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/《证券法》适用范围","category":"通用类","difficulty":"适中","qid":"FD2106-7205","analysis":"本题考察《证券法》的立法宗旨。根据《证券法》第1条，立法核心目的是\"规范证券发行和交易行为，保护投资者的合法权益，维护社会经济秩序和社会公共利益，促进社会主义市场经济的发展\"。其中保护投资者合法权益是首要目标。B项\"扩大市场规模\"、C项\"打击金融犯罪\"、D项\"提高保险业质量\"均非《证券法》的核心宗旨。","important":false,"lecture":true},{"number":2,"type":"单选题","stem":"下列法律中，规范在中华人民共和国境内，股票、公司债券和国务院依法认定的其他证券的发行和交易的是（ ）。","options":[{"key":"A","text":"《中华人民共和国保险法》"},{"key":"B","text":"《中华人民共和国商业银行法》"},{"key":"C","text":"《中华人民共和国证券法》"},{"key":"D","text":"《中华人民共和国证券投资基金法》"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/《证券法》适用范围","category":"通用类","difficulty":"较易","qid":"FD2106-7735","analysis":"本题考察《证券法》的适用范围。根据《证券法》第2条第1款，在中华人民共和国境内，股票、公司债券、存托凭证和国务院依法认定的其他证券的发行和交易，适用本法。A保险法、B商业银行法、D证券投资基金法分别调整各自领域，只有C证券法调整股票和公司债券的发行交易。","important":false},{"number":3,"type":"单选题","stem":"根据《证券法》，为了规范证券发行和交易行为，（ ）维护社会经济秩序和社会公共利益，促进社会主义市场经济的发展，制定本法。","options":[{"key":"A","text":"保护投资者的合法权益"},{"key":"B","text":"支持证券经营机构的不断壮大"},{"key":"C","text":"保障证券交易价格的稳定"},{"key":"D","text":"保证证券发行人能够筹集到所需资金"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/《证券法》适用范围","category":"通用类","difficulty":"适中","qid":"FD2106-9695","analysis":"本题考察《证券法》立法目的的填充。根据《证券法》第1条，制定本法是为了\"规范证券发行和交易行为，保护投资者的合法权益，维护社会经济秩序和社会公共利益，促进社会主义市场经济的发展\"。空白处应填\"保护投资者的合法权益\"，A正确。B/C/D均不是立法目的表述。","important":false,"lecture":true},{"number":4,"type":"单选题","stem":"下列事项中，不属于《证券法》适用范围的是（ ）。","options":[{"key":"A","text":"境内股票、公司债券、存托凭证和国务院依法认定的其他证券的发行、交易"},{"key":"B","text":"政府债券、证券投资基金份额的上市交易"},{"key":"C","text":"资产支持证券、资产管理产品的发行、交易"},{"key":"D","text":"期货、期货衍生品的发行、交易"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/《证券法》适用范围","category":"通用类","difficulty":"较易","qid":"FD2109-2417","analysis":"本题考察《证券法》适用范围（排除项）。《证券法》第2条明确适用范围包括：境内股票、公司债券、存托凭证、政府债券和基金份额的上市交易等。⚠期货、期货衍生品的发行、交易适用《期货和衍生品法》，不适用《证券法》。D为正确答案。政府债券和基金份额仅\"上市交易\"环节适用证券法，发行环节不适用。","important":true},{"number":5,"type":"单选题","stem":"根据《证券法》，证券发行和交易必须遵循的原则不包括（ ）。","options":[{"key":"A","text":"公开"},{"key":"B","text":"公平"},{"key":"C","text":"公正"},{"key":"D","text":"公益"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券发行和交易“三公原则”与当事人行为准则","category":"通用类","difficulty":"较易","qid":"FD2106-0346","analysis":"本题考察证券发行和交易的\"三公原则\"。《证券法》第3条规定：\"证券的发行、交易活动，必须遵循公开、公平、公正的原则。\"即三公原则=公开+公平+公正。D\"公益\"是干扰项，不在三公原则之内。⚠注意区分三公原则（适用于发行和交易活动）与当事人行为准则（自愿、有偿、诚实信用）。","important":true},{"number":6,"type":"单选题","stem":"根据《证券法》，证券发行、交易活动的当事人具有平等的法律地位，应当遵守的原则不包括（ ）。","options":[{"key":"A","text":"自愿"},{"key":"B","text":"有偿"},{"key":"C","text":"营利性"},{"key":"D","text":"诚实信用"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券发行和交易“三公原则”与当事人行为准则","category":"通用类","difficulty":"较易","qid":"FD2106-0614","analysis":"本题考察证券交易当事人的行为准则。《证券法》第4条规定当事人应当遵守\"自愿、有偿、诚实信用\"的原则。C\"营利性\"并非法定原则，属于干扰项。⚠注意三公原则（第3条）与当事人行为准则（第4条）的内容区分。","important":true},{"number":7,"type":"单选题","stem":"下列证券的发行、交易行为，属于《证券法》禁止的是（ ）。","options":[{"key":"A","text":"关联交易"},{"key":"B","text":"使用杠杆"},{"key":"C","text":"操纵证券市场"},{"key":"D","text":"大宗交易"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券发行和交易“三公原则”与当事人行为准则","category":"通用类","difficulty":"较易","qid":"FD2106-1804","analysis":"本题考察《证券法》禁止的交易行为。《证券法》第5条明确禁止欺诈、内幕交易和操纵证券市场。C\"操纵证券市场\"是法律明确禁止的行为。A关联交易本身不违法（需依法披露）；B使用杠杆（融资融券）是合法交易方式；D大宗交易是正常交易机制。","important":false},{"number":8,"type":"单选题","stem":"根据《证券法》，下列情形中，属于公开发行证券的是（ ）。","options":[{"key":"A","text":"定向增发"},{"key":"B","text":"向累计不超过五十人的特定对象发行证券"},{"key":"C","text":"向累计不超过一百人的特定对象发行证券"},{"key":"D","text":"向不特定对象发行证券"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券公开发行的定义","category":"通用类","difficulty":"较易","qid":"FD2106-0248","analysis":"本题考察公开发行证券的认定。《证券法》第9条第1款规定公开发行情形：①向不特定对象发行（D正确）；②向特定对象发行累计超过200人；③其他。A定向增发可能是非公开发行；B/C向特定对象发行未超过200人不属于公开发行。","important":false,"lecture":true},{"number":9,"type":"单选题","stem":"根据《证券法》，下列关于证券发行的说法，错误的是（ ）。","options":[{"key":"A","text":"公开发行证券，必须符合法律、行政法规规定的条件，并依法报经国务院证券监督管理机构或者国务院授权的部门注册"},{"key":"B","text":"向不特定对象发行证券属于公开发行"},{"key":"C","text":"证券发行注册制的具体范围、实施步骤，由国务院证券监督管理机构或者国务院授权的部门规定"},{"key":"D","text":"非公开发行证券，不得采用广告、公开劝诱和变相公开方式"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券公开发行的定义","category":"通用类","difficulty":"较难","qid":"FD2106-8048","analysis":"本题考察证券发行注册制相关规定。C项错误，根据《证券法》第9条第3款，注册制的具体范围、实施步骤由\"国务院\"规定，而非证监会。A正确（公开发行须注册），B正确（不特定对象=公开发行），D正确（非公开发行不得公开劝诱）。⚠这是2019年修订的重要变化。","important":true,"lecture":true},{"number":10,"type":"单选题","stem":"根据《证券法》，向特定对象发行股票后股东累计超过（ ）人，但依法实施员工持股计划的员工人数不计算在内，为公开发行。","options":[{"key":"A","text":"100"},{"key":"B","text":"200"},{"key":"C","text":"300"},{"key":"D","text":"500"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券公开发行的定义","category":"通用类","difficulty":"较易","qid":"FD2106-9178","analysis":"本题考察公开发行的人数认定。《证券法》第9条第2款规定：向特定对象发行证券累计超过\"二百人\"的属于公开发行，但依法实施员工持股计划的员工人数不计算在内。B正确。⚠员工持股计划人数不计入200人的计算。","important":true},{"number":11,"type":"单选题","stem":"根据《证券法》，设立股份有限公司公开发行股票，应当符合规定的条件并向国务院证券监督管理机构报送募股申请和相关文件。下列文件中，不是必须要报送的是（ ）。","options":[{"key":"A","text":"公司季度报告"},{"key":"B","text":"发起人协议"},{"key":"C","text":"招股说明书"},{"key":"D","text":"公司章程"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/公开发行并上市的一般性规则","category":"通用类","difficulty":"较难","qid":"FD2106-1598","analysis":"本题考察设立股份公司公开发行股票应报送的文件。《证券法》第11条规定应报送：公司章程、发起人协议、招股说明书等，但不包括\"公司季度报告\"。A正确。季度报告是上市后的持续信息披露义务，而非发行申请阶段必须报送的文件。","important":false,"lecture":true},{"number":12,"type":"单选题","stem":"根据《证券法》，下列关于公司首次公开发行新股条件的说法，正确的是（ ）。","options":[{"key":"A","text":"前一次发行的股份已募足，并间隔一年以上"},{"key":"B","text":"公司预期利润率可达同期银行存款利率"},{"key":"C","text":"最近三年连续盈利，并可向股东支付股利"},{"key":"D","text":"最近三年财务会计报告被出具无保留意见审计报告"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/公开发行并上市的一般性规则","category":"通用类","difficulty":"较易","qid":"FD2106-2028","analysis":"本题考察首次公开发行新股的条件。《证券法》第12条规定IPO条件：①健全组织机构；②持续经营能力（⚠不是\"持续盈利\"）；③最近3年财务报告无保留意见；④发行人及控股股东、实控人最近3年无特定犯罪。D正确。A/B/C均为旧法已取消的条件。","important":true},{"number":13,"type":"单选题","stem":"根据《证券法》，国务院证券监督管理机构或者国务院授权的部门，依照法定条件负责（ ）的注册。","options":[{"key":"A","text":"证券发行申请"},{"key":"B","text":"股票研究报告发布申请"},{"key":"C","text":"股票流通申请"},{"key":"D","text":"债券质押申请"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/公开发行并上市的一般性规则","category":"通用类","difficulty":"较易","qid":"FD2106-2993","analysis":"本题考察证券发行注册的负责机构。《证券法》第10条规定：公开发行证券须报经\"国务院证券监督管理机构或者国务院授权的部门\"注册。A\"证券发行申请\"正确。B/C/D中的研究报告发布、股票流通、债券质押均不属于注册事项。","important":false},{"number":14,"type":"单选题","stem":"根据《证券法》，下列条件中，不属于首次公开发行新股条件的是（ ）。","options":[{"key":"A","text":"公司近三年连续盈利"},{"key":"B","text":"公司具备健全且运行良好的组织机构"},{"key":"C","text":"实际控制人最近三年不存在贪污、贿赂、侵占财产、挪用财产等情形"},{"key":"D","text":"控股股东最近三年不存在破坏社会主义市场经济秩序的刑事犯罪"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/公开发行并上市的一般性规则","category":"通用类","difficulty":"适中","qid":"FD2106-5226","analysis":"本题考察首次公开发行新股条件（排除项）。《证券法》第12条规定的IPO条件中不包含\"近三年连续盈利\"。2019年修订已从\"持续盈利\"改为\"持续经营能力\"，这是注册制改革核心理念变化。A不是当前IPO条件。⚠高频考点。","important":true,"lecture":true},{"number":15,"type":"单选题","stem":"根据《证券法》，发行人申请公开发行可转换为股票的公司债券，依法采取承销方式的，应当聘请（ ）担任保荐人。","options":[{"key":"A","text":"咨询机构"},{"key":"B","text":"评级机构"},{"key":"C","text":"证券公司"},{"key":"D","text":"行业专家"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/公开发行债券的规则","category":"通用类","difficulty":"较易","qid":"FD2106-1939","analysis":"本题考察公开发行可转债的保荐人要求。《证券法》第15条第2款规定：公开发行可转换公司债券，依法采取承销方式的，应当聘请\"证券公司\"担任保荐人。C正确。A咨询机构、B评级机构、D行业专家均不能担任保荐人。","important":false},{"number":16,"type":"单选题","stem":"根据《证券法》，具有下列情形的公司中，可以公开发行公司债券的是（ ）。","options":[{"key":"A","text":"对已公开发行的公司债券有违约的事实，仍处于继续状态"},{"key":"B","text":"对已公开发行的公司债券有延迟支付本息的事实，仍处于继续状态"},{"key":"C","text":"违反法律规定，改变公开发行公司债券所募资金的用途"},{"key":"D","text":"公司累计债券余额超过公司净资产的百分之四十"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/公开发行债券的规则","category":"通用类","difficulty":"较难","qid":"FD2106-3043","analysis":"本题考察不得公开发行公司债券的情形。《证券法》第17条规定禁止情形包括：①有违约或延迟支付本息事实仍处继续状态（A/B）；②违反规定改变募资用途（C）。D\"累计债券余额超过净资产40%\"不属于禁止情形，故可以公开发行。","important":false,"lecture":true},{"number":17,"type":"单选题","stem":"根据《证券法》，下列关于公开发行公司债券的说法，错误的是（ ）。","options":[{"key":"A","text":"发行人最近三年平均可分配利润足以支付公司债券一年的利息"},{"key":"B","text":"发行人具备健全且运行良好的组织机构"},{"key":"C","text":"经董事会同意，可以改变公开发行公司债券募集资金用途"},{"key":"D","text":"公开发行公司债券筹集的资金，不得用于弥补亏损和非生产性支出"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/公开发行债券的规则","category":"通用类","difficulty":"较易","qid":"FD2109-7899","analysis":"本题考察公开发行公司债券的条件。C项错误，改变募集资金用途须经\"债券持有人会议决议\"，而非董事会决定。根据《证券法》第15条，A（可分配利润足付利息）、B（健全组织机构）均为法定条件，D（不得用于弥补亏损和非生产性支出）正确。","important":false},{"number":18,"type":"单选题","stem":"根据《证券法》，公司对公开发行股票所募集资金，（ ）按照招股说明书或其他公开发行募集文件所列资金用途使用，（ ）改变资金用途。","options":[{"key":"A","text":"可以，可以"},{"key":"B","text":"可以，不得"},{"key":"C","text":"必须，任何条件下不得"},{"key":"D","text":"必须，特定条件下可以"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/公开发行证券的一般性程序","category":"通用类","difficulty":"较易","qid":"FD2106-2436","analysis":"本题考察募集资金的使用规定。《证券法》第14条规定：募股资金\"必须\"按招股说明书用途使用；改变用途\"必须经股东大会作出决议\"。故D\"必须，特定条件下可以\"正确。⚠股票与债券改变用途的决策机构不同：股票为股东大会，债券为债券持有人会议。","important":true,"lecture":true},{"number":19,"type":"单选题","stem":"根据《证券法》，证券公司在承销期结束时将售后剩余证券全部自行购入的承销方式为（ ）。","options":[{"key":"A","text":"证券包销"},{"key":"B","text":"证券代销"},{"key":"C","text":"证券经销"},{"key":"D","text":"证券销售"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券承销业务的种类","category":"通用类","difficulty":"较易","qid":"FD2106-9397","analysis":"本题考察证券包销的定义。《证券法》第26条第2款规定：证券包销是指证券公司将发行人的证券按照协议全部购入或在承销期结束时将售后剩余证券全部自行购入。A正确。B代销是退还发行人；C/D不是法定分类。⚠包销与代销的核心区别在于证券公司是否承担发行风险。","important":true},{"number":20,"type":"单选题","stem":"根据《证券法》，下列关于证券承销业务方式的说法，错误的是（ ）。","options":[{"key":"A","text":"证券承销业务采取代销或者包销方式"},{"key":"B","text":"证券代销是指证券公司代发行人发售证券，在承销期结束时，将未售出的证券全部退还给发行人的承销方式"},{"key":"C","text":"证券包销是指证券公司将发行人的证券按照协议全部购入或者在承销期结束时将售后剩余证券全部自行购入的承销方式"},{"key":"D","text":"证券公司在代销期内，可以为本公司预留所代销的证券"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券承销业务的种类","category":"通用类","difficulty":"较易","qid":"FD2109-5240","analysis":"本题考察证券承销业务方式的禁止行为。D项错误，《证券法》第31条第2款规定证券公司不得为本公司预留所代销的证券和预先购入并留存所包销的证券。A/B/C均是对代销和包销方式的正确描述。","important":false},{"number":21,"type":"单选题","stem":"根据《证券法》，保荐人的管理办法由（ ）规定。","options":[{"key":"A","text":"证券公司"},{"key":"B","text":"中央金融委员会"},{"key":"C","text":"国务院证券监督管理机构"},{"key":"D","text":"财政部"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券承销业务的一般性规定","category":"通用类","difficulty":"较易","qid":"FD2106-5094","analysis":"本题考察保荐人管理办法的制定主体。《证券法》第10条第2款规定：\"保荐人的管理办法由国务院证券监督管理机构规定。\"C正确。A证券公司、B中央金融委员会、D财政部均不是制定主体。","important":false},{"number":22,"type":"单选题","stem":"根据《证券法》，证券的代销、包销期限最长不得超过（ ）。","options":[{"key":"A","text":"60日"},{"key":"B","text":"90日"},{"key":"C","text":"6个月"},{"key":"D","text":"1年"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券承销业务的一般性规定","category":"通用类","difficulty":"较易","qid":"FD2106-7272","analysis":"本题考察代销、包销的期限限制。《证券法》第31条第1款规定：\"证券的代销、包销期限最长不得超过九十日。\"B正确。⚠注意是90日（而非60日、6个月或1年），这是法定上限。","important":true},{"number":23,"type":"单选题","stem":"根据《证券法》，股票发行采用代销方式，向投资者出售的股票数量未达到拟公开发行股票数量百分之（ ）的，为发行失败。","options":[{"key":"A","text":"五十"},{"key":"B","text":"六十"},{"key":"C","text":"七十"},{"key":"D","text":"八十"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券承销业务的一般性规定","category":"通用类","difficulty":"较易","qid":"FD2106-7403","analysis":"本题考察发行失败的标准。《证券法》第33条第2款规定：代销方式下，出售数量未达拟公开发行数量\"百分之七十\"的，为发行失败。C正确。⚠代销有发行失败风险，包销不存在发行失败（证券公司已全部购入）。","important":true},{"number":24,"type":"单选题","stem":"根据《证券法》，股票发行采取溢价发行的，其发行价格由（ ）确定。","options":[{"key":"A","text":"证券监督管理机构"},{"key":"B","text":"证券交易所"},{"key":"C","text":"投资者"},{"key":"D","text":"发行人与承销的证券公司协商"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券承销业务的一般性规定","category":"通用类","difficulty":"较易","qid":"FD2106-7771","analysis":"本题考察溢价发行价格的确定方式。《证券法》第32条规定：\"发行价格由发行人与承销的证券公司协商确定。\"D正确。A证监会、B交易所不直接定价；C投资者通过询价间接参与。","important":false},{"number":25,"type":"单选题","stem":"根据《证券法》，下列人员中，在6个月内买入股票又卖出的，不需要将所得收益收归公司所有的是（ ）。","options":[{"key":"A","text":"上市公司的董事"},{"key":"B","text":"上市公司高级管理人员"},{"key":"C","text":"上市公司控股股东"},{"key":"D","text":"持有上市公司3%股份的自然人"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券交易的条件和方式","category":"通用类","difficulty":"适中","qid":"FD2106-1411","analysis":"本题考察短线交易的主体范围。《证券法》第44条规定的短线交易主体包括：董监高和持股\"5%以上\"的股东。D\"持有3%股份的自然人\"未达5%门槛，不属于短线交易主体。⚠注意5%是关键门槛线。","important":true,"lecture":true},{"number":26,"type":"单选题","stem":"根据《证券法》，下列关于证券交易方式或制度的说法，正确的是（ ）。","options":[{"key":"A","text":"股票、公司债券及其他证券，只能在证券交易所上市交易"},{"key":"B","text":"证券交易必须采用无纸化交易方式"},{"key":"C","text":"在证券交易所上市交易，应当采用公开的集中交易方式或者国务院证券监督管理机构批准的其他方式"},{"key":"D","text":"证券公司不得从事向客户融资或者融券的证券交易活动"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券交易的条件和方式","category":"通用类","difficulty":"较易","qid":"FD2106-5949","analysis":"本题考察证券交易方式和制度。C正确，根据《证券法》第37条，上市交易应采用公开集中交易方式或证监会批准的其他方式。A错误（也可在其他全国性交易场所交易）；B错误（可采用纸面形式）；D错误（可融资融券）。","important":false},{"number":27,"type":"单选题","stem":"根据《证券法》，下列关于证券发行与交易的相关说法，正确的是（ ）。","options":[{"key":"A","text":"持有公司3%的股东为证券交易内幕信息的知情人"},{"key":"B","text":"证券服务机构可以买卖、公开投资者的信息"},{"key":"C","text":"因职务可以获取内幕信息的证券交易场所的有关人员为证券交易内幕信息的知情人"},{"key":"D","text":"非公开发行证券可以采用广告和公开劝诱方式"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券交易的条件和方式","category":"通用类","difficulty":"较易","qid":"FD2106-9029","analysis":"本题考察内幕信息知情人和制度综合判断。C正确，《证券法》第51条列明因职务可获取内幕信息的交易场所有关人员属于内幕知情人。A错误（须5%以上）；B错误（禁止泄露信息）；D错误（非公开发行不得公开劝诱）。","important":false},{"number":28,"type":"单选题","stem":"根据《证券法》，公开发行的证券，应当在（ ）交易。","options":[{"key":"A","text":"依法设立的证券交易所或者在国务院批准的其他全国性证券交易场所"},{"key":"B","text":"银行"},{"key":"C","text":"基金公司"},{"key":"D","text":"信托公司"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券交易的条件和方式","category":"通用类","difficulty":"较易","qid":"FD2106-9152","analysis":"本题考察公开发行证券的交易场所。《证券法》第37条规定应当在依法设立的证券交易所或国务院批准的其他全国性证券交易场所交易。A正确。⚠注意新三板等场所也可交易公开发行的证券。","important":true},{"number":29,"type":"单选题","stem":"根据《证券法》，股份有限公司申请证券上市交易，应当向（ ）申请，依法审核同意后由双方签订上市协议。","options":[{"key":"A","text":"国家发改委"},{"key":"B","text":"证券交易所"},{"key":"C","text":"地方金融办"},{"key":"D","text":"省级人民政府"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券上市的一般性条件","category":"通用类","difficulty":"较易","qid":"FD2106-3894","analysis":"本题考察证券上市交易的申请对象。《证券法》第46条规定应向\"证券交易所\"提出申请。B正确。A国家发改委、C地方金融办、D省级人民政府均不是上市审核主体。","important":false},{"number":30,"type":"单选题","stem":"根据《证券法》，申请证券上市交易的公司，应当向（ ）提出申请，由其依法审核同意，并由双方签订上市协议。","options":[{"key":"A","text":"证券交易所"},{"key":"B","text":"国务院"},{"key":"C","text":"省级人民政府"},{"key":"D","text":"国务院证券监督管理机构"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券上市的一般性条件","category":"通用类","difficulty":"较易","qid":"FD2106-9952","analysis":"本题考察证券上市交易的审核程序。《证券法》第46条：向证券交易所提出申请，由交易所依法审核同意并签订上市协议。A正确。⚠注意区分：发行注册是证监会负责，上市审核是交易所负责。","important":true},{"number":31,"type":"单选题","stem":"根据《证券法》，下列要求中，不属于证券交易所上市规则规定的上市条件的是（ ）。","options":[{"key":"A","text":"发行人的经营年限"},{"key":"B","text":"发行人的财务状况"},{"key":"C","text":"发行人的最高公开发行比例"},{"key":"D","text":"发行人的公司治理、诚信记录"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券上市的一般性条件","category":"通用类","difficulty":"较易","qid":"FD2109-9028","analysis":"本题考察上市条件（排除项）。C\"最高公开发行比例\"不是上市条件，上市规则规定的是\"最低\"公开发行比例（如≤4亿股本为25%，>4亿股本为10%）。A经营年限、B财务状况、D公司治理均是常见上市条件。","important":false,"lecture":true},{"number":32,"type":"单选题","stem":"证券交易所决定终止证券上市交易的，根据《证券法》，下列说法错误的是（ ）。","options":[{"key":"A","text":"由证券交易所按照业务规则终止其上市交易"},{"key":"B","text":"应当及时公告"},{"key":"C","text":"应当报国务院证券监督管理机构备案"},{"key":"D","text":"应当报国务院证券监督管理机构审批"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券终止上市交易的情形","category":"通用类","difficulty":"较易","qid":"FD2106-9999","analysis":"本题考察终止上市的程序。D项错误，终止上市应报证监会\"备案\"而非\"审批\"。《证券法》第48条规定：决定终止上市交易的，应当及时公告，并报国务院证券监督管理机构备案。A/B/C均正确。⚠备案≠审批。","important":true},{"number":33,"type":"单选题","stem":"对证券交易所作出的不予上市交易、终止上市交易决定不服的，根据《证券法》，下列说法正确的是（ ）。","options":[{"key":"A","text":"可以向证券交易所所在地的仲裁机构提起仲裁"},{"key":"B","text":"可以向证券交易所设立的复核机构申请复核"},{"key":"C","text":"可以向国务院证券监督管理机构申请行政复议"},{"key":"D","text":"可以向证券交易所所在地的中级人民法院提起诉讼"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券终止上市交易的情形","category":"通用类","difficulty":"较易","qid":"FD2109-5086","analysis":"本题考察不服终止上市决定的救济途径。《证券法》第48条第3款规定：可向证券交易所设立的\"复核机构\"申请复核。B正确。⚠注意复核是向交易所内部机构申请，而非仲裁、行政复议或诉讼。","important":true},{"number":34,"type":"单选题","stem":"根据《证券法》规定，上市公司下列人员中，不属于证券交易内幕信息的知情人的是（ ）。","options":[{"key":"A","text":"上市公司董事、高级管理人员"},{"key":"B","text":"上市公司无法接触到内幕信息的普通员工"},{"key":"C","text":"持有上市公司5%股份的个人股东"},{"key":"D","text":"上市公司控股股东的董事、监事、高级管理人员"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/禁止内幕交易相关规定","category":"通用类","difficulty":"较易","qid":"FD2106-2426","analysis":"本题考察内幕信息知情人的范围（排除项）。《证券法》第51条列举的内幕知情人包括：董监高、持5%以上股份股东及其董监高、控股股东及其董监高等。B\"普通员工\"不属于内幕知情人。","important":false,"lecture":true},{"number":35,"type":"单选题","stem":"根据《证券法》，持有公司（ ）以上股份的股东及其董事、监事、高级管理人员，属于证券交易内幕信息的知情人。","options":[{"key":"A","text":"3%"},{"key":"B","text":"5%"},{"key":"C","text":"7%"},{"key":"D","text":"10%"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/禁止内幕交易相关规定","category":"通用类","difficulty":"较易","qid":"FD2106-6541","analysis":"本题考察内幕信息知情人的持股门槛。《证券法》第51条第（二）项：持有公司\"5%\"以上股份的股东及其董监高为内幕知情人。B正确。⚠5%是内幕知情人、短线交易主体、收购预警等多个制度中的关键数字。","important":true},{"number":36,"type":"单选题","stem":"根据《证券法》，证券交易内幕信息的知情人和非法获取内幕信息的人，在内幕信息公开前，（ ）该公司的证券。","options":[{"key":"A","text":"不得买入，但可以卖出"},{"key":"B","text":"可以公开买卖"},{"key":"C","text":"不得买卖"},{"key":"D","text":"仅可以大宗交易方式买卖"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/禁止内幕交易相关规定","category":"通用类","difficulty":"较易","qid":"FD2106-6733","analysis":"本题考察内幕交易的禁止行为。《证券法》第53条第1款规定：内幕信息知情人和非法获取内幕信息的人，在内幕信息公开前\"不得买卖\"该公司的证券。C正确。同时也不得泄露或建议他人买卖。","important":false},{"number":37,"type":"单选题","stem":"下列属于内幕交易行为的是（ ）。","options":[{"key":"A","text":"证券公司员工以他人名义为自己买卖证券"},{"key":"B","text":"证券公司利用资金、信息优势，影响证券交易价格"},{"key":"C","text":"发行人的董事向他人透露公司分立决定的内幕信息，使他人利用该信息进行交易"},{"key":"D","text":"证券公司将自营资金与资管资金混合操作"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/禁止内幕交易相关规定","category":"通用类","difficulty":"较易","qid":"FD2109-1196","analysis":"本题考察内幕交易行为的认定。C正确，发行人的董事向他人透露公司分立决定的内幕信息，使他人利用该信息交易，属于典型的内幕交易（泄露内幕信息+建议他人买卖）。A是借名交易；B是操纵市场；D是混合操作。","important":false},{"number":38,"type":"单选题","stem":"根据《证券法》，下列关于从事内幕交易承担的法律责任的说法，错误的是（ ）。","options":[{"key":"A","text":"国务院证券监督管理机构工作人员从事内幕交易的，从重处罚"},{"key":"B","text":"没有违法所得的，给予警告"},{"key":"C","text":"单位从事内幕交易的，还应当处罚直接负责的主管人员和其他直接责任人员"},{"key":"D","text":"证券交易内幕信息的知情人违反规定从事内幕交易的，责令依法处理非法持有的证券，没收违法所得，并处以法定数额罚款"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/禁止内幕交易相关规定","category":"通用类","difficulty":"较易","qid":"FD2109-9470","analysis":"本题考察内幕交易的法律责任。B项错误，根据《证券法》第191条，内幕交易没有违法所得的，处以\"50万元以上500万元以下\"罚款，而非仅\"给予警告\"。A正确（监管人员从重），C正确（单位双罚），D正确。","important":false},{"number":39,"type":"单选题","stem":"根据《证券法》，下列关于从事内幕交易承担的法律责任的说法，错误的是（ ）。","options":[{"key":"A","text":"责令依法处理非法持有的证券，没收违法所得，并处以违法所得一倍以上十倍以下的罚款"},{"key":"B","text":"没有违法所得或者违法所得不足五十万元的，处以五十万元以上五百万元以下的罚款"},{"key":"C","text":"单位从事内幕交易的，还应当对直接负责的主管人员和其他直接责任人员给予警告，并处以二十万元以上二百万元以下的罚款"},{"key":"D","text":"单位从事内幕交易的，仅处罚单位，不处罚个人"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/禁止内幕交易相关规定","category":"通用类","difficulty":"较难","qid":"FD2109-0000","analysis":"本题考察单位内幕交易的双罚制。D项错误，根据《证券法》第191条第2款，单位从事内幕交易的，除对单位处罚外，还应对直接负责的主管人员和其他直接责任人员给予警告并处罚款。即\"双罚制\"，既处罚单位也处罚个人。","important":false,"lecture":true},{"number":40,"type":"单选题","stem":"根据《证券法》，下列事项中不属于内幕信息的是（ ）。","options":[{"key":"A","text":"已公开披露的公司分配股利的计划"},{"key":"B","text":"公司股权结构的重大变化"},{"key":"C","text":"公司营业用主要资产的抵押、质押、出售或报废一次超过该资产的百分之三十"},{"key":"D","text":"公司董事、高级管理人员涉嫌犯罪被依法采取强制措施"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/内幕信息的概念","category":"通用类","difficulty":"较易","qid":"FD2106-5021","analysis":"本题考察内幕信息（排除已公开信息）。内幕信息的核心特征是\"尚未公开\"且\"对证券价格有重大影响\"。A\"已公开披露的公司分配股利的计划\"因已公开，不属于内幕信息。B/C/D均属于尚未公开时可能影响价格的内幕信息。","important":false},{"number":41,"type":"单选题","stem":"根据《证券法》，证券交易活动的下列信息中，不属于内幕信息的是（ ）。","options":[{"key":"A","text":"涉及发行人经营的尚未公开的信息"},{"key":"B","text":"涉及发行人财务的尚未公开的信息"},{"key":"C","text":"对该发行人证券的市场价格有重大影响的尚未公开的信息"},{"key":"D","text":"涉及发行人的人力资源规划，对该发行人证券的市场价格没有重大影响的尚未公开的信息"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/内幕信息的概念","category":"通用类","difficulty":"较易","qid":"FD2109-1720","analysis":"本题考察内幕信息的构成要件。《证券法》第52条：内幕信息须涉及经营、财务或对证券价格有重大影响且尚未公开。D项\"对市场价格没有重大影响\"不符合要件。⚠内幕信息三要素：涉及经营/财务+对价格有重大影响+尚未公开。","important":true},{"number":42,"type":"单选题","stem":"根据《证券法》，上市公司下列事件中，不属于重大事件的是（ ）。","options":[{"key":"A","text":"公司订立重要合同、提供重大担保或者从事关联交易，可能对公司的资产、负债、权益和经营成果产生重要影响"},{"key":"B","text":"公司的经营方针和经营范围的重大变化"},{"key":"C","text":"公司在一年内购买、出售重大资产达到公司资产总额百分之十五"},{"key":"D","text":"公司发生重大债务和未能清偿到期重大债务的违约情况"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/内幕信息的概念","category":"通用类","difficulty":"较易","qid":"FD2109-7062","analysis":"本题考察重大事件的范围（排除项）。根据《证券法》第80条，购买、出售重大资产超过公司资产总额\"30%\"才属重大事件。C项为15%，未达30%门槛。⚠30%是购买/出售重大资产的门槛线。A/B/D均属于明确列举的重大事件。","important":true},{"number":43,"type":"单选题","stem":"某上市公司董事长在自己实际控制的账户之间进行该上市公司的证券交易，影响证券交易价格或者证券交易量。根据《证券法》，下列说法正确的是（ ）。","options":[{"key":"A","text":"合法，因该行为不违反平等自愿、等价有偿的原则"},{"key":"B","text":"合法，因该行为不违反交易自由、风险自担的原则"},{"key":"C","text":"不合法，因该行为属于操纵证券市场的行为"},{"key":"D","text":"不合法，因该行为属于欺诈客户的行为"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/操纵证券市场的行为","category":"通用类","difficulty":"适中","qid":"FD2106-2205","analysis":"本题考察操纵证券市场行为的认定。董事长在自己实际控制的账户之间进行证券交易，影响证券交易价格或交易量，属于《证券法》第55条第1款第（三）项的\"自买自卖\"操纵行为。C正确。A/B称合法错误；D\"欺诈客户\"特征不符。","important":false,"lecture":true},{"number":44,"type":"单选题","stem":"根据《证券法》，下列不属于操纵证券市场行为的是（ ）。","options":[{"key":"A","text":"与他人串通，以事先约定的时间、价格和方式相互进行证券交易，影响证券交易价格或者证券交易量"},{"key":"B","text":"利用虚假或者不确定的重大信息，诱导投资者进行证券交易，影响证券交易价格或者证券交易量"},{"key":"C","text":"利用自己的投资研究能力买卖股票，希望获得投资收益"},{"key":"D","text":"利用在其他相关市场的活动操纵证券市场，影响证券交易价格或者证券交易量"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/操纵证券市场的行为","category":"通用类","difficulty":"较易","qid":"FD2109-0109","analysis":"本题考察操纵市场行为与正常投资的区分。C\"利用自己的投资研究能力买卖股票\"属于正常投资行为。《证券法》第55条禁止的操纵手段包括约定交易、虚假信息诱导、跨市场操纵等。A/B/D均属于操纵市场行为。⚠正常投资研究不构成操纵。","important":true},{"number":45,"type":"单选题","stem":"根据《证券法》，下列不属于操纵证券市场行为的是（ ）。","options":[{"key":"A","text":"单独或者通过合谋，集中资金优势、持股优势或者利用信息优势联合或者连续买卖，影响证券交易价格或者证券交易量"},{"key":"B","text":"在自己实际控制的账户之间进行证券交易，影响证券交易价格或者证券交易量"},{"key":"C","text":"不以成交为目的，频繁或者大量申报并撤销申报，影响证券交易价格或者证券交易量"},{"key":"D","text":"对证券、发行人公开作出评价、预测或者投资建议，并进行合法的证券交易"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/操纵证券市场的行为","category":"通用类","difficulty":"较易","qid":"FD2109-3627","analysis":"本题考察操纵市场行为的排除。D项不构成操纵，因为对证券、发行人公开作出评价、预测或投资建议，并进行\"合法的\"证券交易，不属于操纵（\"抢帽子\"反向交易才构成）。A集中优势连续买卖、B自买自卖、C虚假申报均属于第55条列举的操纵行为。","important":false},{"number":46,"type":"单选题","stem":"根据《证券法》，下列行为中，属于操纵证券市场的是（ ）。","options":[{"key":"A","text":"某上市公司分配股利、增资的计划，投资者尚未得知，张某作为该上市公司的高级管理人员，知晓该信息后，建议其岳父买卖该上市公司股票"},{"key":"B","text":"王某利用因职务便利获取的未公开信息，以获利为目的，大量交易该未公开信息所涉股票"},{"key":"C","text":"李某以减持股票获利为目的，通过集中资金优势、持股优势连续交易，影响股票交易价格和交易量"},{"key":"D","text":"刘某作为上市公司董事，在卖出本公司股票一个月后又买入"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/操纵证券市场的行为","category":"通用类","difficulty":"较难","qid":"FD2109-7114","analysis":"本题考察操纵市场行为的认定。C项\"通过集中资金优势、持股优势连续交易，影响股票交易价格和交易量\"符合《证券法》第55条第1款第（一）项的规定。A属于内幕交易（建议买卖）；B属于利用未公开信息交易（老鼠仓）；D属于短线交易。","important":false,"lecture":true},{"number":47,"type":"单选题","stem":"根据《证券法》，下列交易行为中，不违反规定的是（ ）。","options":[{"key":"A","text":"违背客户的委托为其买卖证券"},{"key":"B","text":"投资者违规利用财政资金、银行信贷资金买卖证券"},{"key":"C","text":"出借自己的证券账户或者借用他人的证券账户从事证券交易"},{"key":"D","text":"国有独资公司经国家有关部门授权或批准买卖上市交易的股票"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/禁止性交易行为","category":"通用类","difficulty":"较易","qid":"FD2109-1062","analysis":"本题考察禁止性交易行为的例外。D项正确，根据《证券法》规定，国有独资公司经国家有关部门授权或批准可买卖上市交易的股票。A违背客户委托、B违规利用信贷资金、C出借/借用证券账户均属于法律明确禁止的行为。","important":false},{"number":48,"type":"单选题","stem":"根据《证券法》，下列关于证券交易行为的说法，错误的是（ ）。","options":[{"key":"A","text":"禁止任何单位和个人编造、传播虚假信息或者误导性信息，扰乱证券市场"},{"key":"B","text":"禁止证券公司及其从业人员在证券交易活动中作出虚假陈述或者信息误导"},{"key":"C","text":"编造、传播虚假信息或者误导性信息，扰乱证券市场，给投资者造成损失的，应当承担连带赔偿责任"},{"key":"D","text":"传播媒介及其从事证券市场信息报道的工作人员不得从事与其工作职责发生利益冲突的证券买卖"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/禁止性交易行为","category":"通用类","difficulty":"较易","qid":"FD2109-2593","analysis":"本题考察编造传播虚假信息的法律责任。C项错误，根据《证券法》第56条，编造、传播虚假信息给投资者造成损失的，应依法承担\"赔偿责任\"，而非\"连带赔偿责任\"。A/B/D均正确。连带责任有特定适用情形（如第85条）。","important":false},{"number":49,"type":"单选题","stem":"根据《证券法》，禁止证券公司及其从业人员从事损害客户利益的行为，证券公司的下列行为中，不属于禁止行为的是（ ）。","options":[{"key":"A","text":"具备融资融券业务资格的证券公司为客户提供融资"},{"key":"B","text":"不在规定时间内向客户提供交易的确认文件"},{"key":"C","text":"为牟取佣金收入，诱使客户进行不必要的证券买卖"},{"key":"D","text":"未经客户的委托，擅自为客户买卖证券"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/禁止性交易行为","category":"通用类","difficulty":"较易","qid":"FD2109-7030","analysis":"本题考察证券公司禁止行为的排除。A正确，具备融资融券业务资格的证券公司为客户提供融资是合法业务。B（不提供确认文件）、C（诱使不必要买卖）、D（未经委托买卖）均属于《证券法》第57条禁止的损害客户利益的行为。","important":false},{"number":50,"type":"单选题","stem":"根据《证券法》，下列关于证券账户管理及从事证券交易的有关说法，错误的是（ ）。","options":[{"key":"A","text":"任何单位和个人不得违反规定，出借自己的证券账户从事证券交易"},{"key":"B","text":"证券公司及其从业人员对证券交易中发现的禁止的交易行为，应当认真查明责任人和交易细节后，向证券交易所报告"},{"key":"C","text":"任何单位和个人不得违反规定，借用他人的证券账户从事证券交易"},{"key":"D","text":"证券公司员工不得接受客户的全权委托为其买卖证券"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/禁止性交易行为","category":"通用类","difficulty":"较易","qid":"FD2109-7780","analysis":"本题考察证券账户管理和交易报告。B项错误，根据《证券法》第109条，发现禁止交易行为后应及时向\"证券监督管理机构\"报告，而非向证券交易所报告。A/C/D均正确。","important":false},{"number":51,"type":"单选题","stem":"根据《证券法》，下列关于要约收购的有关说法，正确的是（ ）。","options":[{"key":"A","text":"收购要约提出的各项收购条件，适用于被收购公司的所有股东"},{"key":"B","text":"在收购要约确定的承诺期限内，收购人可以撤销其收购要约，但须及时公告"},{"key":"C","text":"采取要约收购方式的，收购人在收购期限内，可以卖出被收购公司的股票"},{"key":"D","text":"采取要约收购方式的，收购人在收购期限内，可采取超出要约的条件买入被收购公司的股票"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司要约收购","category":"通用类","difficulty":"较易","qid":"FD2109-1167","analysis":"本题考察要约收购的平等对待原则。A正确，《证券法》第66条第2款规定收购条件适用于被收购公司的\"所有股东\"。B错误（承诺期内不得撤销）；C错误（收购期内不得卖出）；D错误（不得超出条件买入）。","important":false},{"number":52,"type":"单选题","stem":"根据《证券法》，下列关于要约收购的有关说法，错误的是（ ）。","options":[{"key":"A","text":"通过证券交易所的证券交易，投资者持有一个上市公司已发行的有表决权股份达到百分之三十时，继续进行收购的，应当发出收购要约"},{"key":"B","text":"依照规定发出收购要约，收购人必须公告上市公司收购报告书，并载明相关事项"},{"key":"C","text":"收购要约约定的收购期限不得少于三十日，并不得超过九十日"},{"key":"D","text":"收购期限届满，被收购公司股权分布不符合证券交易所规定的上市交易要求的，该上市公司的股票应当由证券交易所依法终止上市交易"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司要约收购","category":"通用类","difficulty":"较易","qid":"FD2109-2149","analysis":"本题考察要约收购的期限。C项错误，根据《证券法》第67条，收购期限不得少于30日，并\"不得超过60日\"。A/B/D均正确。⚠注意要约收购期限：最短30日、最长60日，区别于承销期最长90日。","important":true},{"number":53,"type":"单选题","stem":"根据《证券法》，在上市公司收购中，收购人持有的被收购的上市公司的股票，在收购行为完成后的（ ）不得转让。","options":[{"key":"A","text":"12个月内"},{"key":"B","text":"18个月内"},{"key":"C","text":"24个月内"},{"key":"D","text":"36个月内"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司协议收购方式","category":"通用类","difficulty":"较易","qid":"FD2106-0029","analysis":"本题考察收购人持股锁定期。《证券法》第75条：收购人持有的被收购公司股票，在收购行为完成后的\"18个月\"内不得转让。B正确。⚠注意18个月锁定期与短线交易6个月、内幕交易期间的区别。","important":true},{"number":54,"type":"单选题","stem":"根据《证券法》，通过证券交易所的证券交易，投资者持有或者通过协议、其他安排与他人共同持有一个上市公司已发行的有表决权股份达到（ ）时，应当在该事实发生之日起三日内，向国务院证券监督管理机构、证券交易所作出书面报告，通知该上市公司，并予公告。","options":[{"key":"A","text":"1%"},{"key":"B","text":"5%"},{"key":"C","text":"10%"},{"key":"D","text":"15%"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司收购持股5%时程序与规则","category":"通用类","difficulty":"较易","qid":"FD2106-3951","analysis":"本题考察上市公司收购的权益披露起始点。《证券法》第63条：持股达到\"5%\"时，应在3日内报告并公告。B正确。⚠5%是多个制度的关键门槛线：内幕知情人、短线交易主体、收购预警均以5%为线。","important":true},{"number":55,"type":"单选题","stem":"根据《证券法》，投资者持有或者通过协议、其他安排与他人共同持有一个上市公司已发行的有表决权股份达到百分之五后，其所持该上市公司已发行的有表决权股份比例每增加或者减少（ ），应当在该事实发生的次日通知该上市公司，并予公告。","options":[{"key":"A","text":"1%"},{"key":"B","text":"2%"},{"key":"C","text":"3%"},{"key":"D","text":"5%"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司收购持股5%时程序与规则","category":"通用类","difficulty":"较易","qid":"FD2106-5656","analysis":"本题考察持股5%后每增减1%的披露义务。《证券法》第63条第2款：持股达5%后每增减\"1%\"，应在次日通知上市公司并公告。A正确。⚠注意区分：5%时须报告+3日内不得买卖；5%后每增减1%仅通知+公告（可继续交易）。","important":true},{"number":56,"type":"单选题","stem":"根据《证券法》，通过证券交易所的证券交易，投资者持有或者通过协议、其他安排与他人共同持有一个上市公司已发行的有表决权股份达到（ ）时，继续进行收购的，应当依法向该上市公司所有股东发出收购上市公司全部或者部分股份的要约。","options":[{"key":"A","text":"10%"},{"key":"B","text":"20%"},{"key":"C","text":"30%"},{"key":"D","text":"50%"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司收购持股5%时程序与规则","category":"通用类","difficulty":"较易","qid":"FD2106-9340","analysis":"本题考察要约收购的触发条件。《证券法》第65条：持股达\"30%\"时继续进行收购的，应发出全面或部分要约。C正确。","important":false},{"number":57,"type":"单选题","stem":"根据《证券法》，下列关于信息披露的说法，错误的是（ ）。","options":[{"key":"A","text":"信息披露义务人披露的信息，应当真实、准确、完整，简明清晰，通俗易懂，不得有虚假记载、误导性陈述或者重大遗漏"},{"key":"B","text":"证券同时在境内境外公开发行、交易的，其信息披露义务人可以选择在境外或境内证券交易场所之一披露相关信息"},{"key":"C","text":"发行人及其他信息披露义务人，应当及时依法履行信息披露义务"},{"key":"D","text":"依法披露的信息，应当在证券交易场所的网站和符合规定条件的媒体发布，同时将其置备于公司住所、证券交易场所，供社会公众查阅"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司信息披露一般性规定","category":"通用类","difficulty":"较易","qid":"FD2109-3710","analysis":"本题考察信息披露的基本原则。B项错误，《证券法》第78条：境内外同步披露原则，信息披露义务人应在\"境内同步披露\"，而非选择披露。A/C/D均正确。","important":false},{"number":58,"type":"单选题","stem":"根据《证券法》，下列关于信息披露的说法，错误的是（ ）。","options":[{"key":"A","text":"信息披露义务人披露的信息应当同时向所有投资者披露，除法律、行政法规另有规定的，不得提前向任何单位和个人泄露"},{"key":"B","text":"任何单位和个人不得非法要求信息披露义务人提供依法需要披露但尚未披露的信息"},{"key":"C","text":"除依法需要披露的信息之外，信息披露义务人不得自愿披露与投资者作出价值判断和投资决策有关的信息"},{"key":"D","text":"信息披露义务人披露的信息，不得误导投资者"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司信息披露一般性规定","category":"通用类","difficulty":"较易","qid":"FD2109-9481","analysis":"本题考察自愿信息披露。C项错误，《证券法》第84条：信息披露义务人\"可以\"自愿披露与投资者决策相关的信息，而非\"不得\"自愿披露。A/B/D均正确。","important":false},{"number":59,"type":"单选题","stem":"根据《证券法》，上市公司通过（ ）形式向投资者披露其经营状况的有关信息。","options":[{"key":"A","text":"年度报告、中期报告、临时公告"},{"key":"B","text":"新闻发布会"},{"key":"C","text":"记者招待会"},{"key":"D","text":"投资者路演推介会"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司定期报告的一般性披露规则","category":"通用类","difficulty":"较易","qid":"FD2106-7343","analysis":"本题考察信息披露的形式。《证券法》第79条规定应通过\"年度报告、中期报告、临时公告\"形式披露。A正确。B新闻发布会、C记者招待会、D路演推介会均不是法定披露形式。","important":false},{"number":60,"type":"单选题","stem":"根据《证券法》，上市公司的下列文件中，属于定期报告的是（ ）。","options":[{"key":"A","text":"月度报告"},{"key":"B","text":"中期报告"},{"key":"C","text":"对外投资公告"},{"key":"D","text":"招股说明书"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司定期报告的一般性披露规则","category":"通用类","difficulty":"较易","qid":"FD2106-8479","analysis":"本题考察定期报告的范围。《证券法》第79条规定的定期报告包括：年度报告和中期报告（半年度报告）。B正确。A月度报告、C对外投资公告、D招股说明书均不属于定期报告。","important":false},{"number":61,"type":"单选题","stem":"根据《证券法》，上市公司应当在每一会计年度结束之日起（ ）个月内，报送并公告年度报告。","options":[{"key":"A","text":"3"},{"key":"B","text":"4"},{"key":"C","text":"5"},{"key":"D","text":"6"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司定期报告的一般性披露规则","category":"通用类","difficulty":"较易","qid":"FD2106-9711","analysis":"本题考察年度报告的披露时限。《证券法》第79条：年报应在每一会计年度结束之日起\"4个月\"内报送并公告。B正确。⚠注意区分：年报4个月，中报2个月。","important":true,"lecture":true},{"number":62,"type":"单选题","stem":"根据《证券法》，上市公司和公司债券上市交易的公司，应当在每一个会计年度的上半年结束之日起（ ）内，向证券交易所报送中期报告。","options":[{"key":"A","text":"1个月"},{"key":"B","text":"2个月"},{"key":"C","text":"3个月"},{"key":"D","text":"4个月"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司定期报告的一般性披露规则","category":"通用类","difficulty":"较易","qid":"FD2106-9895","analysis":"本题考察中期报告的披露时限。《证券法》第79条：中报应在每一会计年度上半年结束之日起\"2个月\"内向证监会和交易所报送。B正确。⚠区分年报4个月与中报2个月。","important":true},{"number":63,"type":"单选题","stem":"根据《证券法》，下列事项中上市公司必须以临时报告形式公告的是（ ）。","options":[{"key":"A","text":"董事辞职"},{"key":"B","text":"业务部门经理辞职"},{"key":"C","text":"公司经营范围的变化"},{"key":"D","text":"持有公司4%股份的股东，其持有股份情况发生变化"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司临时报告的一般性披露规则","category":"通用类","difficulty":"较易","qid":"FD2106-3642","analysis":"本题考察临时报告应当公告的重大事件。《证券法》第80条：\"董事辞职\"属于\"公司董事发生变动\"，应以临时报告公告。A正确。B部门经理不在法定范围；C须重大变化；D4%股份未达5%门槛。","important":false},{"number":64,"type":"单选题","stem":"根据《证券法》，上市公司定期报告应当由公司（ ）签署书面确认意见。","options":[{"key":"A","text":"董事长、董事会秘书"},{"key":"B","text":"董事长、总经理"},{"key":"C","text":"董事长、高级管理人员"},{"key":"D","text":"董事、高级管理人员"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司临时报告的一般性披露规则","category":"通用类","difficulty":"较难","qid":"FD2106-5657","analysis":"本题考察定期报告签署确认意见的主体。《证券法》第82条：\"董事和高级管理人员\"应对定期报告签署书面确认意见。D正确。⚠注意不包括监事（监事应审核并提出书面审核意见）。","important":true,"lecture":true},{"number":65,"type":"单选题","stem":"根据《证券法》，发行上市交易公司债券的公司发生下列事项时，不需以临时报告形式公告的是（ ）。","options":[{"key":"A","text":"债券信用评级发生变化"},{"key":"B","text":"发生未能清偿到期债务的情况"},{"key":"C","text":"业务部门经理辞职"},{"key":"D","text":"生产经营状况发生重大变化"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司临时报告的一般性披露规则","category":"通用类","difficulty":"较易","qid":"FD2106-8678","analysis":"本题考察公司债券临时报告事项（排除项）。《证券法》第81条规定了债券临时报告事项包括：债券信用评级变化、未能清偿到期债务、生产经营状况重大变化等。C\"业务部门经理辞职\"不在法定范围内。A/B/D均属于应公告事项。","important":false},{"number":66,"type":"单选题","stem":"根据《证券法》，下列属于上市公司临时报告中应披露的重大事件的是（ ）。","options":[{"key":"A","text":"公司的经营方针和经营范围的重大变化"},{"key":"B","text":"公司某项业务微亏"},{"key":"C","text":"公司董事会秘书因身体原因无法正常履行职责一个月"},{"key":"D","text":"公司在一年内出售资产达到公司资产总额的百分之二十五"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司临时报告的一般性披露规则","category":"通用类","difficulty":"适中","qid":"FD2106-9314","analysis":"本题考察临时报告中的重大事件。《证券法》第80条明确列举的重大事件包括\"经营方针和经营范围的重大变化\"。A正确。B\"业务微亏\"不属重大；C董秘1个月无法履职未达标准；D出售资产须达\"30%\"才属重大，25%未达门槛。","important":false,"lecture":true},{"number":67,"type":"单选题","stem":"根据《证券法》，依法披露的信息，应当在（ ）发布。","options":[{"key":"A","text":"当地最大报纸"},{"key":"B","text":"证券专业网站"},{"key":"C","text":"证券交易场所的网站和符合国务院证券监督管理机构规定条件的媒体"},{"key":"D","text":"电视电台"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司信息披露法律责任","category":"通用类","difficulty":"较易","qid":"FD2106-0635","analysis":"本题考察信息披露的发布渠道。《证券法》第86条：应在\"证券交易场所的网站和符合证监会规定条件的媒体\"发布。C正确。同时应置备于公司住所和证券交易场所供公众查阅。","important":false},{"number":68,"type":"单选题","stem":"根据《证券法》，发行人、上市公司公告的信息披露资料，有虚假记载、误导性陈述或者重大遗漏，致使投资者在证券交易中遭受损失，下列关于赔偿责任的说法中，错误的是（ ）。","options":[{"key":"A","text":"发行人应当承担赔偿责任"},{"key":"B","text":"上市公司应当承担赔偿责任"},{"key":"C","text":"发行人、上市公司的董事、高级管理人员和其他直接责任人员应当与发行人、上市公司承担连带赔偿责任，但是能够证明自己没有过错的除外"},{"key":"D","text":"保荐人、承销的证券公司及其直接责任人员，必须与发行人、上市公司承担连带赔偿责任"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/上市公司信息披露法律责任","category":"通用类","difficulty":"较易","qid":"FD2106-1456","analysis":"本题考察虚假陈述的赔偿责任。D项错误，《证券法》第85条：保荐人、承销商承担\"过错推定\"连带责任（能证明无过错的除外），而非绝对连带。A/B正确（发行人无过错责任），C正确（董监高过错推定连带）。","important":false},{"number":69,"type":"单选题","stem":"根据《证券法》，上市公司当年税后利润，在弥补亏损及提取法定公积金后有盈余的，应当按照（ ）分配现金股利。","options":[{"key":"A","text":"控股股东的要求"},{"key":"B","text":"公司章程的规定"},{"key":"C","text":"公司内部制度的规定"},{"key":"D","text":"职工代表大会的决定"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/投资者保护","category":"通用类","difficulty":"较易","qid":"FD2106-0233","analysis":"本题考察利润分配的依据。《证券法》第91条规定：上市公司应当按照\"公司章程的规定\"分配现金股利。B正确。A控股股东要求、C内部制度、D职代会决定均非法定依据。","important":false},{"number":70,"type":"单选题","stem":"根据《证券法》，下列机构或人员中，不属于可以作为征集人，自行或者委托证券公司、证券服务机构，公开请求上市公司股东委托其代为出席股东会，并代为行使提案权、表决权等股东权利的是（ ）。","options":[{"key":"A","text":"上市公司总经理"},{"key":"B","text":"上市公司董事会"},{"key":"C","text":"上市公司独立董事"},{"key":"D","text":"上市公司持有1%以上有表决权股份的股东"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/投资者保护","category":"通用类","difficulty":"适中","qid":"FD2106-5089","analysis":"本题考察股东权利征集的主体资格。《证券法》第90条规定的征集人包括：董事会、独立董事、持有1%以上有表决权股份的股东、投资者保护机构。A\"总经理\"不在法定征集人范围内。","important":false},{"number":71,"type":"单选题","stem":"根据《证券法》，投资者提起虚假陈述等证券民事赔偿诉讼时，投资者保护机构受（ ）名以上投资者委托，可以作为代表人参加诉讼。","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"20"},{"key":"D","text":"50"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/投资者保护","category":"通用类","difficulty":"较易","qid":"FD2106-7144","analysis":"本题考察代表人诉讼的受托人数。《证券法》第95条第2款：投资者保护机构受\"50名\"以上投资者委托，可作为代表人参加诉讼。D正确。","important":false},{"number":72,"type":"单选题","stem":"根据《证券法》，下列关于证券交易所的说法，错误的是（ ）。","options":[{"key":"A","text":"证券交易所可以根据证券品种、行业特点、公司规模等因素设立不同的市场层次"},{"key":"B","text":"实行会员制的证券交易所在其存续期间，可以根据理事会的决议将其财产积累定期分配给会员"},{"key":"C","text":"证券交易所履行自律管理职能，应当遵守社会公共利益优先原则，维护市场的公平、有序、透明"},{"key":"D","text":"证券交易所必须在其名称中标明证券交易所字样"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/关于证券交易所的一般性规定","category":"通用类","difficulty":"较易","qid":"FD2109-1206","analysis":"本题考察会员制证券交易所的财产分配。B项错误，根据《证券法》第101条，会员制交易所在其存续期间不得将其财产积累分配给会员。A/C/D均正确。","important":false},{"number":73,"type":"单选题","stem":"根据《证券法》，下列关于证券交易所的说法，正确的是（ ）。","options":[{"key":"A","text":"证券交易所设立的风险基金由中国投资者保护基金公司管理"},{"key":"B","text":"证券交易所的设立、变更和解散由国务院决定"},{"key":"C","text":"证券交易所制定上市规则、交易规则、会员管理规则和其他有关业务规则，应当报国务院证券监督管理机构备案"},{"key":"D","text":"证券交易所总经理由证券交易所理事会选举产生，并报国务院证券监督管理机构批准"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/关于证券交易所的一般性规定","category":"通用类","difficulty":"较易","qid":"FD2109-7749","analysis":"本题考察证券交易所的设立和管理。B正确，《证券法》第101条规定交易所的设立、变更和解散由国务院决定。A错误（风险基金由交易所自行管理）；C错误（规则应报批）；D错误（总经理由证监会任免）。","important":false},{"number":74,"type":"单选题","stem":"根据《证券法》，下列有关证券交易保障和证券交易行情管理的说法，错误的是（ ）。","options":[{"key":"A","text":"证券交易所应当为组织公平的集中交易提供保障，实时公布证券交易即时行情"},{"key":"B","text":"证券交易所应按交易日制作证券市场行情表，予以公布"},{"key":"C","text":"证券交易即时行情的权益由卫星通信公司依法享有"},{"key":"D","text":"未经证券交易所许可，任何单位和个人不得发布证券交易即时行情"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券交易所的交易规则","category":"通用类","difficulty":"较易","qid":"FD2109-5755","analysis":"本题考察证券交易即时行情的权益归属。C项错误，《证券法》第108条规定证券交易即时行情的权益由\"证券交易所\"依法享有。A/B/D均正确。⚠行情数据权益属于交易所，未经许可不得发布。","important":true},{"number":75,"type":"单选题","stem":"根据《证券法》，下列有关证券交易规则的说法，错误的是（ ）。","options":[{"key":"A","text":"证券公司为投资者开立账户，应当按照规定对投资者提供的身份信息进行核对"},{"key":"B","text":"投资者可以使用实名开立的账户进行交易，也可以使用非实名开立的账户进行交易"},{"key":"C","text":"投资者应当与证券公司签订证券交易委托协议"},{"key":"D","text":"证券公司根据成交结果承担相应的清算交收责任"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券交易所的交易规则","category":"通用类","difficulty":"较易","qid":"FD2109-6357","analysis":"本题考察证券账户实名制。B项错误，《证券法》第107条要求投资者应当使用\"实名开立\"的账户进行交易，不得使用非实名账户。A/C/D均正确。⚠证券账户实名制是基本要求。","important":true},{"number":76,"type":"单选题","stem":"根据《证券法》，下列有关证券交易规则的说法，错误的是（ ）。","options":[{"key":"A","text":"证券交易所对按照业务规则采取取消交易、通知证券登记结算机构暂缓交收等措施造成的损失，应当承担民事赔偿责任"},{"key":"B","text":"按照依法制定的交易规则进行的交易，不得改变其交易结果，证券交易所按照业务规则采取取消交易、通知证券登记结算机构暂缓交收等措施的除外"},{"key":"C","text":"交易结果改变的，对交易中违规交易者应负的民事责任不得免除"},{"key":"D","text":"因不可抗力而影响证券交易正常进行时，为维护证券交易正常秩序和市场公平，证券交易所可以按照业务规则采取技术性停牌、临时停市等处置措施，并应当及时向国务院证券监督管理机构报告"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券交易所的交易规则","category":"通用类","difficulty":"较易","qid":"FD2109-9158","analysis":"本题考察交易所按规则采取措施的免责。A项错误，根据《证券法》第113条，交易所按业务规则采取取消交易等措施造成损失的，\"不承担民事赔偿责任\"（重大过错除外）。B/C/D均正确。","important":false},{"number":77,"type":"单选题","stem":"根据《证券法》，在一定期限内直至终身不得从事证券业务、证券服务业务，不得担任证券发行人的董事、监事、高级管理人员，或者一定期限内不得在证券交易所、国务院批准的其他全国性证券交易场所交易证券的制度是指（ ）。","options":[{"key":"A","text":"资格限制"},{"key":"B","text":"同业禁止"},{"key":"C","text":"回避"},{"key":"D","text":"证券市场禁入"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券法其他知识点","category":"通用类","difficulty":"较易","qid":"FD2106-0054","analysis":"本题考察证券市场禁入制度的定义。D正确，根据《证券法》第221条，证券市场禁入是指在一定期限内直至终身不得从事证券业务/服务业务、不得担任发行人董监高、或不得在特定场所交易证券的制度。","important":false},{"number":78,"type":"单选题","stem":"根据《证券法》，（ ）提供沪、深证券交易所上市证券集中登记、存管与结算服务。","options":[{"key":"A","text":"中国证券业协会"},{"key":"B","text":"中国证监会派出机构"},{"key":"C","text":"中国证券监督管理委员会"},{"key":"D","text":"中国证券登记结算有限责任公司"}],"answer":"D","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券法其他知识点","category":"通用类","difficulty":"较易","qid":"FD2106-4666","analysis":"本题考察证券登记结算机构。《证券法》第147条：\"中国证券登记结算有限责任公司\"提供沪、深证券交易所上市证券集中登记、存管与结算服务。D正确。A证券业协会是自律组织；B/C是监管机构。","important":false},{"number":79,"type":"单选题","stem":"根据《证券法》，（ ）依法对全国证券市场实行集中统一监督管理。","options":[{"key":"A","text":"全国人大"},{"key":"B","text":"国务院"},{"key":"C","text":"国务院证券监督管理机构"},{"key":"D","text":"中国人民银行"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券法其他知识点","category":"通用类","difficulty":"适中","qid":"FD2106-6153","analysis":"本题考察证券市场的监管主体。《证券法》第168条：\"国务院证券监督管理机构（证监会）\"依法对证券市场实行集中统一监督管理。C正确。A全国人大是立法机关；B国务院是行政机关；D央行负责货币政策。","important":false},{"number":80,"type":"单选题","stem":"《证券法》规定，国务院证券监督管理机构或者国务院授权的部门参与证券发行申请注册的人员，不得与发行申请人有利害关系，不得直接或者间接接受发行申请人的馈赠，不得持有所注册的发行申请的证券，不得（ ）。","options":[{"key":"A","text":"与发行申请人进行接触"},{"key":"B","text":"与发行申请人聘用的中介机构进行接触"},{"key":"C","text":"私下与发行申请人进行接触"},{"key":"D","text":"与发行申请人所属的行业协会进行接触"}],"answer":"C","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/与发行申请人交往的规定","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0001","analysis":"本题考察参与注册审核人员的廉洁要求。《证券法》第23条：不得\"私下与发行申请人进行接触\"。C正确。A/B过于绝对（正常工作接触允许）；D不涉及。⚠注意廉洁从业要求。","important":true},{"number":81,"type":"单选题","stem":"《证券法》规定，因违法行为或者违纪行为被开除的证券交易场所、证券公司、证券登记结算机构、证券服务机构的从业人员和被开除的国家机关工作人员，（ ）招聘为证券交易所的从业人员。","options":[{"key":"A","text":"不得"},{"key":"B","text":"违法违纪事由发生5年内不得"},{"key":"C","text":"被开除5年内不得"},{"key":"D","text":"违法违纪事由发生3年内不得"}],"answer":"A","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/证券交易所禁止招聘的人员","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0003","analysis":"本题考察被开除人员的招聘禁止。《证券法》第106条：因违法行为被开除的证券从业人员和国家机关工作人员，\"不得\"招聘为证券交易所的从业人员。A正确，是永久性禁止。","important":false},{"number":82,"type":"单选题","stem":"《证券法》规定，国务院证券监督管理机构工作人员必须忠于职守、依法办事、公正廉洁，不得利用职务便利牟取不正当利益，不得泄露所知悉的有关单位和个人的商业秘密。国务院证券监督管理机构工作人员在任职期间，或者离职后在《公务员法》规定的期限内，不得到与原工作业务直接相关的企业或者其他营利性组织任职，不得（ ）。","options":[{"key":"A","text":"从事与原工作业务间接相关的营利性活动"},{"key":"B","text":"从事与原工作业务直接相关的营利性活动"},{"key":"C","text":"与原工作业务相关的企业商业往来"},{"key":"D","text":"到与原工作业务相关的非营利性组织任职"}],"answer":"B","knowledge":"一、法律/1.中华人民共和国证券法（1998年12月29日公布，2019年12月28日最新修订，2020年3月1日起施行）/任职回避的规定","category":"廉洁从业类","difficulty":"适中","qid":"FD2210-0002","analysis":"本题考察证监会工作人员离职后的从业限制。《证券法》第187条：离职后在《公务员法》规定期限内，不得从事与原工作业务\"直接相关\"的营利性活动。B正确。⚠注意\"直接相关\"的营利性活动被禁止。\n第一部分 法律——公司法\n共62题","important":true,"lecture":true},{"number":83,"type":"单选题","stem":"根据《公司法》，下列关于公司的说法，错误的是（ ）。","options":[{"key":"A","text":"公司以其全部财产对公司的债务承担责任"},{"key":"B","text":"凡是依法设立的企业都是公司"},{"key":"C","text":"公司是按照《公司法》设立的企业法人"},{"key":"D","text":"公司享有法人财产权"}],"answer":"B","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司的种类","category":"通用类","difficulty":"较易","qid":"FD2106-3861","analysis":"本题考察公司的概念。B项错误，并非所有企业都是公司，企业包括公司、合伙企业、个人独资企业等多种形态，只有按《公司法》设立的企业法人才是公司。根据《公司法》第3条，公司以全部财产对债务承担责任。A/C/D均正确。","important":false},{"number":84,"type":"单选题","stem":"根据《公司法》，公司的类型不包括（ ）。","options":[{"key":"A","text":"有限责任公司"},{"key":"B","text":"股份有限公司"},{"key":"C","text":"国家出资公司"},{"key":"D","text":"合伙企业"}],"answer":"D","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司的种类","category":"通用类","difficulty":"较易","qid":"FD2109-0046","analysis":"本题考察公司类型。《公司法》规定的公司类型包括有限责任公司、股份有限公司和国家出资公司。D\"合伙企业\"受《合伙企业法》调整，不属于公司类型。","important":false},{"number":85,"type":"单选题","stem":"根据《公司法》，公司是（ ），有独立的法人财产，享有法人财产权。","options":[{"key":"A","text":"机关法人"},{"key":"B","text":"社会团体法人"},{"key":"C","text":"企业法人"},{"key":"D","text":"公益组织"}],"answer":"C","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司的法人财产权","category":"通用类","difficulty":"较易","qid":"FD2106-1932","analysis":"本题考察公司的法人性质。《公司法》第3条：\"公司是企业法人\"。C正确。A机关法人、B社会团体法人、D公益组织均不是公司的法人类型。","important":false},{"number":86,"type":"单选题","stem":"根据《公司法》，股份有限公司的股东以其（ ）为限对公司承担责任。","options":[{"key":"A","text":"认购的股份"},{"key":"B","text":"自有资金"},{"key":"C","text":"全部资产"},{"key":"D","text":"取得的分红"}],"answer":"A","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司的法人财产权","category":"通用类","difficulty":"较易","qid":"FD2106-6369","analysis":"本题考察股份有限公司股东的责任形式。《公司法》第4条：股东以其\"认购的股份\"为限对公司承担责任。A正确。⚠有限责任公司股东以认缴出资额为限承担责任。","important":true},{"number":87,"type":"单选题","stem":"根据《公司法》，股份有限公司以其（ ）对公司的债务承担责任。","options":[{"key":"A","text":"出资人财产"},{"key":"B","text":"股东财产"},{"key":"C","text":"经营资产"},{"key":"D","text":"全部财产"}],"answer":"D","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司的法人财产权","category":"通用类","difficulty":"较易","qid":"FD2106-8749","analysis":"本题考察公司的债务承担。《公司法》第3条第2款：公司以其\"全部财产\"对公司的债务承担责任。D正确。","important":false},{"number":88,"type":"单选题","stem":"根据《公司法》，下列关于公司的法人财产权的有关说法，错误的是（ ）。","options":[{"key":"A","text":"公司是企业法人，有独立的法人财产，享有法人财产权"},{"key":"B","text":"公司以其全部财产对公司的债务承担责任"},{"key":"C","text":"有限责任公司的股东以其个人财产对公司承担责任"},{"key":"D","text":"股份有限公司的股东以其认购的股份为限对公司承担责任"}],"answer":"C","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司的法人财产权","category":"通用类","difficulty":"较易","qid":"FD2109-8980","analysis":"本题考察法人财产权和股东有限责任。C项错误，有限责任公司股东以\"认缴的出资额\"为限对公司承担责任，而非以\"个人财产\"。A/B/D均正确。","important":false},{"number":89,"type":"单选题","stem":"根据《公司法》，下列关于公司的子公司与分公司的说法，正确的是（ ）。","options":[{"key":"A","text":"前者是法人，后者不是法人"},{"key":"B","text":"后者是法人，前者不是法人"},{"key":"C","text":"两者都不是法人"},{"key":"D","text":"两者都是法人"}],"answer":"A","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司的设立","category":"通用类","difficulty":"较易","qid":"FD2106-2232","analysis":"本题考察子公司与分公司的法律地位。A正确，根据《公司法》第13条，子公司具有法人资格，独立承担民事责任；分公司不具有法人资格，民事责任由总公司承担。⚠注意区分。","important":true},{"number":90,"type":"单选题","stem":"根据《公司法》，公司（ ）为公司成立日期。","options":[{"key":"A","text":"成立大会通过日期"},{"key":"B","text":"营业执照签发日期"},{"key":"C","text":"股东协议签署日期"},{"key":"D","text":"验资报告出具日期"}],"answer":"B","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司的设立","category":"通用类","difficulty":"较易","qid":"FD2106-4074","analysis":"本题考察公司成立日期。《公司法》第30条：\"营业执照签发日期\"为公司成立日期。B正确。A成立大会日期、C股东协议日期、D验资日期均不是。","important":false},{"number":91,"type":"单选题","stem":"根据《公司法》，有限责任公司的成立日期是（ ）。","options":[{"key":"A","text":"股东完成缴纳出资日期"},{"key":"B","text":"法定验资机构验资日期"},{"key":"C","text":"营业执照签发日期"},{"key":"D","text":"公司章程签署日期"}],"answer":"C","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司的设立","category":"通用类","difficulty":"较难","qid":"FD2106-5498","analysis":"本题考察有限责任公司成立日期。《公司法》第30条：公司的成立日期为\"营业执照签发日期\"。C正确。⚠注意统一标准：各类公司均以营业执照签发日期为成立日期。","important":true},{"number":92,"type":"单选题","stem":"根据《公司法》，公司以（ ）所在地为公司住所。","options":[{"key":"A","text":"主要经营"},{"key":"B","text":"公司登记"},{"key":"C","text":"公司主要办事机构"},{"key":"D","text":"公司章程确定的"}],"answer":"C","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司的设立","category":"通用类","difficulty":"较易","qid":"FD2106-7039","analysis":"本题考察公司住所的确定。《公司法》第9条：公司的住所是\"公司主要办事机构所在地\"。C正确。","important":false},{"number":93,"type":"单选题","stem":"根据《公司法》，下列不能担任公司法定代表人的是（ ）。","options":[{"key":"A","text":"经理"},{"key":"B","text":"独立董事"},{"key":"C","text":"代表公司执行公司事务的董事"},{"key":"D","text":"董事长"}],"answer":"B","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司章程","category":"通用类","difficulty":"适中","qid":"FD2106-3159","analysis":"本题考察法定代表人的任职资格。《公司法》第10条：法定代表人由\"代表公司执行公司事务的董事或经理\"担任。B独立董事不能担任法定代表人，因为独立董事不执行公司事务。A/C/D均可。","important":false,"lecture":true},{"number":94,"type":"单选题","stem":"根据《公司法》，下列关于公司章程的有关说法，错误的是（ ）。","options":[{"key":"A","text":"公司的法定代表人按照公司章程的规定，由代表公司执行公司事务的董事或者经理担任"},{"key":"B","text":"公司可以修改公司章程，改变经营范围，公司的经营范围中属于法律、行政法规规定须经批准的项目，应当依法经过批准"},{"key":"C","text":"股份有限公司章程应当载明的事项包括公司注册资本、已发行的股份数和设立时发行的股份数，面额股的每股金额"},{"key":"D","text":"有限责任公司章程应当载明的事项包括公司设立方式"}],"answer":"D","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司章程","category":"通用类","difficulty":"较易","qid":"FD2109-5740","analysis":"本题考察公司章程应当载明的事项（排除项）。D项错误，\"公司设立方式\"是股份有限公司章程应当载明的事项，而非有限责任公司章程的必备内容。A/B/C均正确。⚠注意两类公司章程内容的差异。","important":true},{"number":95,"type":"单选题","stem":"根据《公司法》，下列关于公司章程的说法，错误的是（ ）。","options":[{"key":"A","text":"设立公司应当依法制定公司章程"},{"key":"B","text":"公司章程对公司、股东、董事、监事、高级管理人员具有约束力"},{"key":"C","text":"公司的经营范围由公司章程规定"},{"key":"D","text":"股份有限公司的股东应当在公司章程上签名、盖章"}],"answer":"D","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司章程","category":"通用类","difficulty":"较易","qid":"FD2109-6260","analysis":"本题考察公司章程的约束力和签署。D项错误，《公司法》第45条要求\"股东应当在公司章程上签名或者盖章\"是对有限责任公司的要求，股份有限公司的发起人签署的是发起人协议。A/B/C均正确。","important":false},{"number":96,"type":"单选题","stem":"根据《公司法》，下列关于公司担保的说法，错误的是（ ）。","options":[{"key":"A","text":"公司向其他企业投资或者为他人提供担保，按照公司章程的规定，由董事会或者股东会决议"},{"key":"B","text":"公司为公司股东或者实际控制人提供担保的，可经董事会决议生效后实施"},{"key":"C","text":"公司章程对投资或者担保的总额及单项投资或者担保的数额有限额规定的，不得超过规定的限额"},{"key":"D","text":"公司为公司股东或者实际控制人提供担保的，应当经股东会决议"}],"answer":"B","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司对外投资和担保","category":"通用类","difficulty":"适中","qid":"FD2106-1093","analysis":"本题考察公司担保的决策程序。B项错误，根据《公司法》第15条，为公司股东或实控人提供担保，应当经\"股东会决议\"，且该股东不参与表决，不能仅经董事会决议。A/C/D均正确。","important":false,"lecture":true},{"number":97,"type":"单选题","stem":"根据《公司法》，下列关于分公司的说法，错误的是（ ）。","options":[{"key":"A","text":"分公司应当领取营业执照"},{"key":"B","text":"分公司不具有法人资格"},{"key":"C","text":"分公司可以进行经营活动"},{"key":"D","text":"分公司独立承担民事责任"}],"answer":"D","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司对外投资和担保","category":"通用类","difficulty":"较易","qid":"FD2106-8224","analysis":"本题考察分公司的民事责任承担。D项错误，根据《公司法》第13条，分公司不具有法人资格，其民事责任由\"公司（总公司）\"承担。A/B/C均正确。⚠子公司独立担责，分公司由总公司担责。","important":true},{"number":98,"type":"单选题","stem":"根据《公司法》，公司为公司股东或者实际控制人提供担保的，应当经（ ）。","options":[{"key":"A","text":"总经理办公会决议"},{"key":"B","text":"股东会决议"},{"key":"C","text":"董事长书面同意"},{"key":"D","text":"法定代表人书面同意"}],"answer":"B","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布， 用类","difficulty":"较难","qid":"FD2106-7338","analysis":"本题考察有限责任公司股东会的职权（排除项）。C\"决定公司的经营计划和投资方案\"属于\"董事会\"的职权，而非股东会职权。根据《公司法》第37条，股东会职权包括审议批准董事会报告、对发行债券作出决议、修改章程等。⚠注意股东会与董事会职权的区分。","important":true,"lecture":true},{"number":103,"type":"单选题","stem":"根据《公司法》，下列关于公司董事、监事以及高级管理人员兼任的说法，正确的是（ ）。","options":[{"key":"A","text":"公司董事可以兼任公司经理"},{"key":"B","text":"公司董事可以兼任公司监事"},{"key":"C","text":"公司经理可以兼任公司监事"},{"key":"D","text":"公司财务负责人可以兼任公司监事"}],"answer":"A","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/有限责任公司的设立和组织机构","category":"通用类","difficulty":"较易","qid":"FD2106-8634","analysis":"本题考察董监高兼任限制。A正确，《公司法》第74条：董事可以兼任经理。B/C/D均错误，根据第76条，董事、高级管理人员不得兼任监事。⚠监事由股东代表和职工代表担任。","important":true},{"number":104,"type":"单选题","stem":"根据《公司法》，下列关于有限责任公司股东向股东以外的人转让股权的说法，错误的是（ ）。","options":[{"key":"A","text":"应当经其他股东三分之二以上同意"},{"key":"B","text":"应当将股权转让的数量、价格、支付方式和期限等事项书面通知其他股东"},{"key":"C","text":"其他股东在同等条件下有优先购买权"},{"key":"D","text":"股东自接到书面通知之日起三十日内未答复的，视为放弃优先购买权"}],"answer":"A","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/有限责任公司股权转让","category":"通用类","difficulty":"较难","qid":"FD2106-3156","analysis":"本题考察有限责任公司股权对外转让。A项错误，根据《公司法》第71条，对外转让股权应当经其他股东\"过半数\"同意，而非2/3。B/C/D均正确。⚠注意：有限公司对外转让需其他股东过半数同意。","important":true,"lecture":true},{"number":105,"type":"单选题","stem":"根据《公司法》，股份有限公司的股东无权（ ）。","options":[{"key":"A","text":"查阅公司章程"},{"key":"B","text":"查阅股东名册"},{"key":"C","text":"查阅股东会会议记录"},{"key":"D","text":"查阅董事会会议记录"}],"answer":"D","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/股份有限公司设立方式与程序","category":"通用类","difficulty":"适中","qid":"FD2106-6319","analysis":"本题考察股份有限公司股东的知情权（排除项）。D\"董事会会议记录\"不在股东有权查阅的范围之内。《公司法》第110条允许股东查阅：章程、股东名册、股东会会议记录等，未包括董事会会议记录。","important":false,"lecture":true},{"number":106,"type":"单选题","stem":"根据《公司法》，募集设立股份有限公司的成立大会应当有（ ）方可举行。","options":[{"key":"A","text":"全体发起人出席"},{"key":"B","text":"全体认股人出席"},{"key":"C","text":"持有表决权过半数的认股人出席"},{"key":"D","text":"代表股份总数三份之二以上的发起人、认股人出席"}],"answ 6-2383","analysis":"本题考察董监高的合法行为。D\"合法合规将个人资金借贷给他人\"是个人行为，不涉及公司利益。A/B/C均属于《公司法》第181条禁止的违法行为。","important":false,"lecture":true},{"number":132,"type":"单选题","stem":"根据《公司法》，关于公司董事、高级管理人员的行为，下列不属于法律禁止的是（ ）。","options":[{"key":"A","text":"挪用公司资金"},{"key":"B","text":"擅自披露公司秘密"},{"key":"C","text":"将公司资金以其个人名义或者其他个人名义开立账户存储"},{"key":"D","text":"按照公司章程的规定，或者经股东会或者董事会同意，将公司资金借贷给他人"}],"answer":"D","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司董监高责任与义务","category":"通用类","difficulty":"较易","qid":"FD2106-3305","analysis":"本题考察董监高禁止行为的排除。D项不违法，根据《公司法》第180条，按规定经批准后将公司资金借贷给他人是允许的。A/B/C均属于第181条禁止的行为。","important":false},{"number":133,"type":"单选题","stem":"根据《公司法》，股份有限公司董事、监事、高级管理人员在就任时确定的任职期间每年转让的股份不得超过其所持有本公司股份总数的（ ）。","options":[{"key":"A","text":"10%"},{"key":"B","text":"25%"},{"key":"C","text":"30%"},{"key":"D","text":"50%"}],"answer":"B","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/股份有限公司股份发行与转让","category":"通用类","difficulty":"较易","qid":"FD2106-0048","analysis":"本题考察董监高每年转让股份的上限。《公司法》第160条：每年转让不得超过所持本公司股份总数的\"25%\"。B正确。⚠注意上限为25%。","important":true,"lecture":true},{"number":134,"type":"单选题","stem":"根据《公司法》，股份有限公司签发的证明股东所持股份的凭证是（ ）。","options":[{"key":"A","text":"股票"},{"key":"B","text":"公司债券"},{"key":"C","text":"永续债"},{"key":"D","text":"存托凭证"}],"answer":"A","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/股份有限公司股份发行与转让","category":"通用类","difficulty":"较易","qid":"FD2109-0518","analysis":"本题考察证明股东所持股份的凭证。《公司法》第151条：\"股票\"是证明股东所持股份的凭证。A正确。B债券是债权凭证；C永续债是债券品种；D存托凭证是境外股票在境内发行的凭证。","important":false},{"number":135,"type":"单选题","stem":"根据《公司法》，下列关于股份有限公司股份发行的说法，正确的是（ ）。","options":[{"key":"A","text":"面额股股票的发行价格可以按票面金额，也可以低于票面金额"},{"key":"B","text":"股份的发行实行公开、公平、公正的原则"},{"key":"C","text":"不同次发行的同种类股票，每股的发行条件和价格应当相同"},{"key":"D","text":"公司发行的股票，应当为记名股票"}],"answer":"D","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/股份有限公司股份发行与转让","category":"通用类","difficulty":"较易","qid":"FD2109-2937","analysis":"本题考察股份发行规则。D正确，《公司法》第152条要求发行的股票应为\"记名股票\"。A错误（价格不得低于票面金额）；B错误（三公原则不包括\"公开\"）；C错误（不同次发行条件可不同）。","important":false},{"number":136,"type":"单选题","stem":"根据《公司法》，股份有限公司发行的股票，应当为（ ）。","options":[{"key":"A","text":"记名股票"},{"key":"B","text":"无记名股票"},{"key":"C","text":"优先股股票"},{"key":"D","text":"存托凭证"}],"answer":"A","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/股份有限公司股份发行与转让","category":"通用类","difficulty":"较易","qid":"FD2109-3680","analysis":"本题考察股票的类型要求。《公司法》第152条：发行的股票应为\"记名股票\"。A正确。新公司法取消了无记名股票形式。","important":false},{"number":137,"type":"单选题","stem":"根据《公司法》，公司应当在每一会计年度终了时编制财务会计报告，并依法经（ ）审计。","options":[{"key":"A","text":"公司财务部门"},{"key":"B","text":"会计师事务所"},{"key":"C","text":"主管部门"},{"key":"D","text":"公司登记机关"}],"answer":"B","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司财务会计制度基本要求","category":"通用类","difficulty":"较易","qid":"FD2106-1757","analysis":"本题考察财务会计报告的审计要求。《公司法》第207条：应依法经\"会计师事务所\"审计。B正确。A财务部门不能自行审计；C/D不具有审计资格。","important":false},{"number":138,"type":"单选题","stem":"根据《公司法》，下列关于公司公积金的说法，错误的是（ ）。","options":[{"key":"A","text":"公司的公积金用于弥补公司的亏损、扩大公司生产经营或者转为增加公司注册资本"},{"key":"B","text":"公积金弥补公司亏损，应当先使用任意公积金和法定公积金"},{"key":"C","text":"法定公积金转为增加注册资本时，所留存的该项公积金不得少于转增前公司注册资本的百分之二十五"},{"key":"D","text":"资本公积金不得用于弥补公司的亏损"}],"answer":"D","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司财务会计制度基本要求","category":"通用类","difficulty":"较难","qid":"FD2106-9264","analysis":"本题考察公司公积金的使用规则。D项错误，《公司法》第214条规定：先用任意公积金和法定公积金弥补亏损，仍不能的，可按规定使用\"资本公积金\"弥补亏损（2023年修订新增）。A/B/C均正确。","important":false},{"number":139,"type":"单选题","stem":"根据《公司法》，下列不得参与公司分配利润的股份是（ ）。","options":[{"key":"A","text":"QFII股东持有的公司股份"},{"key":"B","text":"沪港通股东持有的公司股份"},{"key":"C","text":"因实行股权激励而回购的公司股份"},{"key":"D","text":"限售股股东持有的公司股份"}],"answer":"C","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司财务会计制度基本要求","category":"通用类","difficulty":"较易","qid":"FD2109-3899","analysis":"本题考察不得参与利润分配的股份。C ry":"通用类","difficulty":"较易","qid":"FD2109-8422","analysis":"本题考察公司分立时应编制的文件。《公司法》第222条：应编制\"资产负债表\"及财产清单。C正确。A利润表、B现金流量表均非法定必须编制的文件。","important":false},{"number":144,"type":"单选题","stem":"根据《公司法》，股份有限公司控股股东是指其持有的股份占股本总额超过（ ）的股东；出资额或者持有股份的比例虽然低于（ ），但依其出资额或者持有的股份所享有的表决权已足以对股东会的决议产生重大影响的股东。","options":[{"key":"A","text":"20%，20%"},{"key":"B","text":"30%，30%"},{"key":"C","text":"40%，40%"},{"key":"D","text":"50%，50%"}],"answer":"D","knowledge":"一、法律/2.中华人民共和国公司法（1993年12月29日公布，2023年12月29日最新修订 2024年7月1日起施行）/公司法其他知识点","category":"通用类","difficulty":"适中","qid":"FD2106-1563","analysis":"本题考察控股股东的定义。《公司法》第265条：持股占股本总额\"50%\"以上；或持股虽低于50%但表决权足以对股东会决议产生重大影响。D正确。\n第一部分 法律——民法典\n共9题","important":false},{"number":145,"type":"单选题","stem":"根据《民法典》，营利法人的执行机构作出决议的会议表决方式违反法人章程，营利法人的出资人（ ）。","options":[{"key":"A","text":"可以要求执行机构重新审议该决议"},{"key":"B","text":"可以拒绝该决议的生效"},{"key":"C","text":"可以请求人民法院撤销该决议"},{"key":"D","text":"可以要求该营利法人返还出资"}],"answer":"C","knowledge":"一、法律/3.中华人民共和国民法典（2020年5月28日公布，2021年1月1日起施行）/营利法人的出资人的责任","category":"通用类","difficulty":"适中","qid":"FD2109-3432","analysis":"本题考察营利法人出资人撤销决议的权利。《民法典》第85条：执行机构决议表决方式违反法人章程的，出资人可\"请求人民法院撤销该决议\"。C正确。","important":false,"lecture":true},{"number":146,"type":"单选题","stem":"根据《民法典》，营利法人的出资人滥用出资人权利造成法人或者其他出资人损失的，应当依法承担（ ）。","options":[{"key":"A","text":"民事责任"},{"key":"B","text":"刑事责任"},{"key":"C","text":"行政责任"},{"key":"D","text":"民事附带刑事责任"}],"answer":"A","knowledge":"一、法律/3.中华人民共和国民法典（2020年5月28日公布，2021年1月1日起施行）/营利法人的出资人的责任","category":"通用类","difficulty":"较易","qid":"FD2109-4446","analysis":"本题考察滥用出资人权利的法律责任。《民法典》第83条第1款：滥用出资人权利造成损失的，应依法承担\"民事责任\"。A正确。","important":false},{"number":147,"type":"单选题","stem":"根据《民法典》，营利法人的出资人滥用法人独立地位和出资人有限责任，逃避债务，严重损害法人债权人的利益的，应当（ ）。","options":[{"key":"A","text":"以出资额为限对法人债务承担责任"},{"key":"B","text":"对法人债务承担连带责任"},{"key":"C","text":"依据公司章程的规定对法人债务承担责任"},{"key":"D","text":"依据发起人协议的约定对法人债务承担责任"}],"answer":"B","knowledge":"一、法律/3.中华人民共和国民法典（2020年5月28日公布，2021年1月1日起施行）/营利法人的出资人的责任","category":"通用类","difficulty":"适中","qid":"FD2109-7568","analysis":"本题考察法人人格否认制度。《民法典》第83条第2款：滥用法人独立地位和有限责任，逃避债务，严重损害债权人利益的，应当\"对法人债务承担连带责任\"。B正确。","important":false},{"number":148,"type":"单选题","stem":"根据《民法典》，无处分权人将不动产或者动产转让给受让人的，关于受让人一般可取得该不动产或者动产所有权的情形，不包括（ ）。","options":[{"key":"A","text":"受让人受让该不动产或者动产时是善意的"},{"key":"B","text":"转让的不动产或者动产不需要登记的已经签署协议"},{"key":"C","text":"转让的不动产或者动产依照法律规定应当登记的已经登记"},{"key":"D","text":"以合理的价格转让"}],"answer":"B","knowledge":"一、法律/3.中华人民共和国民法典（2020年5月28日公布，2021年1月1日起施行）/营利法人对其不动产和动产的权利","category":"通用类","difficulty":"适中","qid":"FD2109-1566","analysis":"本题考察善意取得的要件。《民法典》第311条：善意取得须同时满足：①受让人善意；②合理价格转让；③应当登记的已登记/不需要登记的已交付。B\"已经签署协议\"不符合交付要求，故不属于善意取得的情形。","important":false},{"number":149,"type":"单选题","stem":"根据《民法典》，下列关于不动产或动产权利的说法，错误的是（ ）。","options":[{"key":"A","text":"所有权人对自己的不动产或者动产，依法享有占有、使用、收益和处分的权利"},{"key":"B","text":"所有权人有权在自己的不动产或者动产上设立用益物权和担保物权"},{"key":"C","text":"用益物权人、担保物权人行使权利，不得损害所有权人的权益"},{"key":"D","text":"法律规定专属于国家所有的不动产和动产，组织或者个人经授权方可取得所有权"}],"answer":"D","knowledge":"一、法律/3.中华人民共和国民法典（2020年5月28日公布，2021年1月1日起施行）/营利法人对其不动产和动产的权利","category":"通用类","difficulty":"适中","qid":"FD2109-3447","analysis":"本题考察国家所有权专有规定。D项错误，《民法典》第246条：法律规定专属于国家所有的不动产和动产，任何组织或个人\"不能取得所有权\"，不论是否经授权。A/B/C均正确。","important":false},{"number":150,"type":"单选题","stem":"根据《民法典》，以建筑物抵押的，该建筑物占用范围内的建设用地使用权（ ）。以建设用地使用权抵押的，该土地上的建筑物（ ）。","options":[{"key":"A","text":"一并抵押，一并抵押"},{"key":"B","text":"一并抵押，另行办理抵押"},{"key":"C","text":"另行办理抵押，一并抵押"},{"key":"D","text":"另行办理抵押，另行办理抵押"}],"answer":"A","knowledge":"一、法律/3.中华人民共和国民法典（2020年5月28日公布，2021年1月1日起施行）/营利法人对其不动产和动产的权利","category":"通用类","difficulty":"适中","qid":"FD2109-8035","analysis":"本题考察房地一体抵押原则。《民法典》第397条：以建筑物抵押的，其占用范围内的建设用地使用权\"一并抵押\"；以建设用地使用权抵押的，该土地上的建筑物\"一并抵押\"。A正确。","important":false},{"number":151,"type":"单选题","stem":"根据《民法典》，下列关于所有权人对自己的不动产或动产共有的说法，正确的是（ ）。","options":[{"key":"A","text":"共同共有人对共有的不动产或者动产按照份额享有所有权"},{"key":"B","text":"共有人管理共有的不动产，没有约定的，各共有人都有管理的权利和义务"},{"key":"C","text":"处分共有的动产，除另有约定外应当经占份额半数以上的按份共有人或者全体共同共有人同意"},{"key":"D","text":"没有约定或者约定不明确的，按份共有人不得随时请求分割共有不动产"}],"answer":"B","knowledge":"一、法律/3.中华人民共和国民法典（2020年5月28日公布，2021年1月1日起施行）/营利法人对其不动产和动产的权利","category":"通用类","difficulty":"适中","qid":"FD2109-8732","analysis":"本题考察共有财产的管理和处分。B正确，《民法典》第300条：没有约定的，各共有人都有管理的权利和义务。A错误（共同共有没有份额）；C错误（应经2/3以上按份共有人或全体共同共有人同意）；D错误（按份共有人可随时请求分割）。","important":false},{"number":152,"type":"单选题","stem":"根据《民法典》，营利法人从事经营活动，应当遵守商业道德，维护交易安全，接受政府和社会的监督，承担（ ）。","options":[{"key":"A","text":"盈利责任"},{"key":"B","text":"管理责任"},{"key":"C","text":"社会责任"},{"key":"D","text":"合规责任"}],"answer":"C","knowledge":"一、法律/3.中华人民共和国民法典（2020年5月28日公布，2021年1月1日起施行）/营利法人合规经营规范","category":"通用类","difficulty":"较易","qid":"FD2109-3379","analysis":"本题考察营利法人的社会责任。《民法典》第86条：营利法人应\"承担社会责任\"。C正确。A盈利责任、B管理责任、D合规责任均不是民法典原文表述。","important":false},{"number":153,"type":"单选题","stem":"根据《民法典》，营利法人的权力机构作出决议的会议召集程序违反法律的，营利法人的出资人可以请求人民法院撤销该决议，营利法人依据该决议与善意相对人形成的民事法律关系（ ）。","options":[{"key":"A","text":"依据决议的撤销而撤销"},{"key":"B","text":"经营利法人追认不受影响"},{"key":"C","text":"经善意相对人追认不受影响"},{"key":"D","text":"不受影响"}],"answer":"D","knowledge":"一、法律/3.中华人民共和国民法典（2020年5月28日公布，2021年1月1日起施行）/营利法人合规经营规范","category":"通用类","difficulty":"适中","qid":"FD2109-5151","analysis":"本题考察决议被撤销后对善意相对人的保护。《民法典》第85条但书：营利法人依据决议与善意相对人形成的民事法律关系\"不受影响\"。D正确。旨在保护交易安全和善意第三人。\n第一部分 法律——刑法\n共46题","important":false},{"number":154,"type":"单选题","stem":"甲公司发行股票，在招股说明书中编造重大虚假内容，数额巨大、后果严重。根据《刑法》，下列说法正确的是（ ）。","options":[{"key":"A","text":"对甲公司判处罚金，对责任人员不予处罚"},{"key":"B","text":"对甲公司不予处罚，对甲公司直接负责的主管人员或其他直接责任人员，处五年以下有期徒刑或者拘役"},{"key":"C","text":"对甲公司判处罚金，并对其直接负责的主管人员和其他直接责任人员，处五年以上有期徒刑或者拘役，并处或者单处罚金"},{"key":"D","text":"实际控制人组织实施编造重大虚假内容行为的，处五年以下有期徒刑或者拘役，并处或者单处罚金"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/欺诈发行证券罪","category":"通用类","difficulty":"较难","qid":"FD2106-5297","analysis":"本题考察欺诈发行证券罪的处罚。D正确，根据《刑法》第160条，实控人组织实施编造重大虚假内容发行股票的，处5年以下有期徒刑或拘役，并处或单处罚金。A错误（单位双罚）；B错误（应处罚金）；C错误（表述不准确）。","important":false,"lecture":true},{"number":155,"type":"单选题","stem":"根据 ysis":"本题考察欺诈发行证券罪的犯罪构成。C项错误，该罪主体包括\"单位和个人\"。《刑法》第160条规定自然人和单位均可构成本罪。A/B/D均正确。","important":false},{"number":159,"type":"单选题","stem":"根据《刑法》，单位犯欺诈发行证券罪的，（ ）。","options":[{"key":"A","text":"仅对单位判处罚金"},{"key":"B","text":"仅对直接负责的主管人员和其他直接责任人员判处刑罚"},{"key":"C","text":"对单位判处罚金或对直接负责的主管人员和其他直接责任人员判处刑罚"},{"key":"D","text":"对单位判处罚金并对直接负责的主管人员和其他直接责任人员判处刑罚"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/欺诈发行证券罪","category":"通用类","difficulty":"较易","qid":"FD2109-3396","analysis":"本题考察单位犯欺诈发行证券罪的处罚。D正确，根据《刑法》第160条第2款：对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员判处刑罚（双罚制）。","important":false},{"number":160,"type":"单选题","stem":"下列关于欺诈发行证券罪的犯罪构成的说法，错误的是（ ）。","options":[{"key":"A","text":"欺诈发行证券罪的犯罪主体主要是单位"},{"key":"B","text":"欺诈发行证券罪的主观方面表现为故意或过失"},{"key":"C","text":"欺诈发行证券罪侵犯的客体是复杂客体，即国家对证券市场的管理秩序和投资者的合法权益"},{"key":"D","text":"自然人在一定条件下也能成为欺诈发行证券罪的犯罪主体"}],"answer":"B","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/欺诈发行证券罪","category":"通用类","difficulty":"较易","qid":"FD2109-3362","analysis":"本题考察欺诈发行证券罪的主观要件。B项错误，本罪主观方面为\"故意\"，而非\"故意或过失\"。过失不构成。A/C/D均正确。⚠注意本罪是故意犯罪。","important":true},{"number":161,"type":"单选题","stem":"《刑法》规定，在招股说明书、认股书、公司、企业债券募集办法等发行文件中（ ）或者编造重大虚假内容，发行股票或者公司、企业债券、存托凭证或者国务院依法认定的其他证券，数额巨大、后果严重或者有其他严重情节的，处五年以下有期徒刑或者拘役，并处或者单处罚金；数额特别巨大、后果特别严重或者有其他特别严重情节的，处五年以上有期徒刑，并处罚金。","options":[{"key":"A","text":"隐瞒重要事实"},{"key":"B","text":"隐瞒经营事实"},{"key":"C","text":"泄露本公司所知其他公司商业秘密"},{"key":"D","text":"贬低其他同类公司经营成果"}],"answer":"A","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/欺诈发行证券罪","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0006","analysis":"本题考察欺诈发行证券罪的客观行为。根据《刑法》第160条，在发行文件中\"隐瞒重要事实\"或者编造重大虚假内容发行证券，构成该罪。A正确。","important":false},{"number":162,"type":"单选题","stem":"根据《刑法》，依法负有信息披露义务的公司、企业向股东和社会公众提供虚假的或者隐瞒重要事实的财务会计报告，或者对依法应当披露的其他重要信息不按照规定披露，严重损害股东或者其他人利益，或者有其他严重情节的，对其直接负责的主管人员和其他直接责任人员，处（ ）以下有期徒刑或者拘役，并处或者单处罚金；情节特别严重的，处（ ）有期徒刑，并处罚金。","options":[{"key":"A","text":"一年，一年以上三年以下"},{"key":"B","text":"三年，三
