.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/隐匿、故意销毁会计凭证、会计账簿、财务会计报告罪","category":"通用类","difficulty":"适中","qid":"FD2109-9901","analysis":"本题考察隐匿、故意销毁会计凭证罪的刑罚。《刑法》第162条之一：情节严重的，处5年以下有期徒刑或拘役，并处或单处罚金。C正确。","important":false},{"number":170,"type":"单选题","stem":"根据《刑法》，国家工作人员利用职务上的便利，索取他人财物的，或者非法收受他人财物，为他人谋取利益的，构成（ ）。","options":[{"key":"A","text":"职务侵占罪"},{"key":"B","text":"受贿罪"},{"key":"C","text":"非国家工作人员受贿罪"},{"key":"D","text":"非法牟利罪"}],"answer":"B","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/受贿罪","category":"通用类","difficulty":"较易","qid":"FD2109-6954","analysis":"本题考察受贿罪的认定。《刑法》第385条：国家工作人员利用职务便利，索取财物或非法收受财物为他人谋取利益的，构成\"受贿罪\"。B正确。A职务侵占罪为公司人员；C非国家工作人员受贿罪主体为非国家工作人员。","important":false},{"number":171,"type":"单选题","stem":"根据《刑法》，为谋取不正当利益，给予公司、企业或者其他单位的工作人员以财物，数额较大的，（ ）。","options":[{"key":"A","text":"不构成犯罪"},{"key":"B","text":"构成受贿罪"},{"key":"C","text":"构成对非国家工作人员行贿罪"},{"key":"D","text":"构成对非国家工作人员滥用职权罪"}],"answer":"C","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/对非国家工作人员行贿罪","category":"通用类","difficulty":"较易","qid":"FD2109-0341","analysis":"本题考察对非国家工作人员行贿罪的认定。《刑法》第164条：为谋取不正当利益，给予公司、企业或其他单位工作人员以财物，数额较大的，构成\"对非国家工作人员行贿罪\"。C正确。","important":false},{"number":172,"type":"单选题","stem":"根据《刑法》，单位为谋取不正当利益，给予公司、企业或者其他单位的工作人员以财物，数额较大的，对其直接负责的主管人员和其他直接责任人员（ ）。","options":[{"key":"A","text":"处有期徒刑或者拘役"},{"key":"B","text":"处有期徒刑"},{"key":"C","text":"处有期徒刑，并处或者单处罚金"},{"key":"D","text":"处有期徒刑或者拘役，并处罚金"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/对非国家工作人员行贿罪","category":"通用类","difficulty":"较易","qid":"FD2109-3502","analysis":"本题考察单位对非国家工作人员行贿的处罚。《刑法》第164条第3款：对直接负责的主管人员和其他直接责任人员\"处有期徒刑或者拘役，并处罚金\"。D正确。","important":false},{"number":173,"type":"单选题","stem":"根据《刑法》，犯对非国家工作人员行贿罪，行贿人在被追诉前主动交待行贿行为的，（ ）。","options":[{"key":"A","text":"应当减轻处罚"},{"key":"B","text":"应当免除处罚"},{"key":"C","text":"不得从重或加重处罚"},{"key":"D","text":"可以减轻处罚或者免除处罚"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/对非国家工作人员行贿罪","category":"通用类","difficulty":"较易","qid":"FD2109-6947","analysis":"本题考察对非国家工作人员行贿罪的宽免政策。《刑法》第164条第4款：行贿人在被追诉前主动交待行贿行为的，\"可以减轻处罚或者免除处罚\"。D正确（\"可以\"而非\"应当\"）。","important":false},{"number":174,"type":"单选题","stem":"根据《刑法》，下列关于对非国家工作人员行贿罪的说法，错误的是（ ）。","options":[{"key":"A","text":"该罪的犯罪主体可以是单位或个人"},{"key":"B","text":"只要实施了为谋取不正当利益，给予公司工作人员以财物的行为，即构成该罪"},{"key":"C","text":"犯该罪数额巨大的将被处以有期徒刑并处罚金"},{"key":"D","text":"行贿人在被追诉前主动交待行贿行为的，可以减轻处罚或者免除处罚"}],"answer":"B","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/对非国家工作人员行贿罪","category":"通用类","difficulty":"较易","qid":"FD2109-9188","analysis":"本题考察对非国家工作人员行贿罪的构成要件。B项错误，并非只要实施了给予财物的行为就构成，还需满足谋取不正当利益、达到数额较大等条件。A/C/D均正确。","important":false},{"number":175,"type":"单选题","stem":"《刑法》规定，行贿人（ ）的，可以从轻或者减轻处罚。其中，犯罪较轻的，对侦破重大案件起关键作用的，或者有重大立功表现的，可以减轻或者免除处罚。","options":[{"key":"A","text":"在被追诉前主动交待行贿行为"},{"key":"B","text":"在被追诉前已索回所贿财务"},{"key":"C","text":"在被追诉前主动制止公职人员为本人谋利"},{"key":"D","text":"在被追诉后主动交待行贿行为"}],"answer":"A","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/对非国家工作人员行贿罪","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0004","analysis":"本题考察行贿罪的宽免政策。《刑法》第390条：行贿人在被追诉前\"主动交待行贿行为\"的，可以从轻或减轻处罚。A正确。","important":false},{"number":176,"type":"单选题","stem":"根据《刑法》，下列关于为亲友非法牟利罪的说法，错误的是（ ）。","options":[{"key":"A","text":"公司、企业、事业单位的工作人员为该罪的犯罪主体"},{"key":"B","text":"该罪的构成必须有利用该职务便利的条件"},{"key":"C","text":"该罪的构成必须达到了使国家利益或者公司、企业利益遭受重大损失的结果"},{"key":"D","text":"该罪的犯罪主体包括单位和个人"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/为亲友非法牟利罪","category":"通用类","difficulty":"较易","qid":"FD2109-0055","analysis":"本题考察为亲友非法牟利罪的犯罪主体。D项错误，根据《刑法》第166条，该罪主体为\"国有公司、企业、事业单位的工作人员\"，属于自然人犯罪，\"单位\"不能成为主体。A/B/C均正确。","important":false},{"number":177,"type":"单选题","stem":"根据《刑法》，下列关于为亲友非法牟利罪的说法，错误的是（ ）。","options":[{"key":"A","text":"该罪的犯罪主体为公司、企业、事业单位的工作人员"},{"key":"B","text":"只要实施了以明显高于市场的价格向自己的亲友经营管理的单位采购商品等行为的，即构成该罪"},{"key":"C","text":"犯该罪致使国家利益遭受特别重大损失的将被处以有期徒刑并处罚金"},{"key":"D","text":"向自己的亲友经营管理的单位采购不合格商品，使国家利益遭受重大损失的构成该罪"}],"answer":"B","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/为亲友非法牟利罪","category":"通用类","difficulty":"适中","qid":"FD2109-0501","analysis":"本题考察为亲友非法牟利罪的构成要件。B项错误，除实施以明显高于市场价格采购商品的行为外，还须满足利用职务便利和使国家利益遭受重大损失的条件。A/C/D均正确。","important":false},{"number":178,"type":"单选题","stem":"根据《刑法》，国有公司、企业、事业单位的工作人员，利用职务便利，从事相关行为，致使国家利益遭受重大损失的，构成为亲友非法牟利罪。下列属于构成该罪相关行为的是（ ）。","options":[{"key":"A","text":"将本单位的盈利业务交由自己的亲友进行经营"},{"key":"B","text":"以低于市场的价格向自己的亲友经营管理的单位采购商品"},{"key":"C","text":"以高于市场的价格向自己的亲友经营管理的单位销售商品"},{"key":"D","text":"向自己的亲友经营管理的单位采购商品"}],"answer":"A","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/为亲友非法牟利罪","category":"通用类","difficulty":"较易","qid":"FD2109-9853","analysis":"本题考察为亲友非法牟利罪的行为方式。A正确，《刑法》第166条：将本单位的盈利业务交由亲友经营的构成本罪。B/C/D描述的行为不正确（应为以明显高于市场的价格采购等）。","important":false},{"number":179,"type":"单选题","stem":"根据《刑法》，下列关于国有公司、企业、事业单位人员失职罪的说法，正确的是（ ）。","options":[{"key":"A","text":"国有事业单位的工作人员，由于严重不负责任，造成国有公司、企业破产或者严重损失，致使国家利益遭受重大损失的，从重处罚"},{"key":"B","text":"国有事业单位的工作人员，徇私舞弊，犯本罪的，从轻处罚"},{"key":"C","text":"国有企业的工作人员，由于严重不负责任，造成国有企业破产，致使国家利益遭受特别重大损失的，处三年以上七年以下有期徒刑"},{"key":"D","text":"国有公司的工作人员，徇私舞弊，犯本罪的，从轻处罚"}],"answer":"C","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/国有公司、企业、事业单位人员失职罪","category":"通用类","difficulty":"较易","qid":"FD2109-2807","analysis":"本题考察国有公司人员失职罪的刑罚。C正确，《刑法》第168条：严重不负责任造成国企破产，致使国家利益遭受特别重大损失的，处\"3年以上7年以下有期徒刑\"。","important":false},{"number":180,"type":"单选题","stem":"根据《刑法》，国有企业的工作人员，由于严重不负责任，造成国有企业严重损失，致使国家利益遭受重大损失的，构成（ ）。","options":[{"key":"A","text":"国有公司、企业、事业单位人员失职罪"},{"key":"B","text":"国有公司、企业、事业单位人员滥用职权罪"},{"key":"C","text":"背信损害国家利益罪"},{"key":"D","text":"非法牟利罪"}],"answer":"A","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/国有公司、企业、事业单位人员失职罪","category":"通用类","difficulty":"较易","qid":"FD2109-4822","analysis":"本题考察国有公司人员失职罪的认定。《刑法》第168条：国有企业工作人员严重不负责任造成国企严重损失的，构成\"国有公司、企业、事业单位人员失职罪\"。A正确。","important":false},{"number":181,"type":"单选题","stem":"根据《刑法》，国有企业的工作人员，由于严重不负责任，造成国有企业严重损失，致使国家利益遭受重大损失的，（ ）。","options":[{"key":"A","text":"处有期徒刑或者拘役"},{"key":"B","text":"处有期徒刑"},{"key":"C","text":"处有期徒刑或者拘役，单处或者并处罚金"},{"key":"D","text":"处有期徒刑，并处罚金"}],"answer":"A","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/国有公司、企业、事业单位人员失职罪","category":"通用类","difficulty":"较易","qid":"FD2109-4917","analysis":"本题考察国有公司人员失职罪的刑罚。《刑法》第168条第1款：处\"三年以下有期徒刑或者拘役\"。A正确。不含罚金。","important":false},{"number":182,"type":"单选题","stem":"根据《刑法》，下列构成国有公司、企业、事业单位人员失职罪从重处罚情形的是（ ）。","options":[{"key":"A","text":"国有事业单位的工作人员，由于严重不负责任，造成国有公司、企业破产或者严重损失，致使国家利益遭受重大损失的"},{"key":"B","text":"国家公务员，由于严重不负责任，造成国有公司、企业破产或者严重损失，致使国家利益遭受重大损失的"},{"key":"C","text":"国有公司、企业的工作人员，由于严重不负责任，造成国有公司、企业破产或者严重损失，致使国家利益遭受重大损失的"},{"key":"D","text":"国有公司、企业、事业单位的工作人员，徇私舞弊，造成国有公司、企业破产或者严重损失，致使国家利益遭受重大损失的"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/国有公司、企业、事业单位人员失职罪","category":"通用类","difficulty":"适中","qid":"FD2109-7524","analysis":"本题考察国有公司人员失职罪的从重处罚情形。D正确，《刑法》第168条第3款：\"徇私舞弊\"犯前两款罪的，从重处罚。","important":false},{"number":183,"type":"单选题","stem":"上市公司的董事、高级管理人员违背对公司的忠实义务，利用职务便利，操纵上市公司无偿向其他单位或者个人提供资金、商品、服务或者其他资产，致使上市公司利益遭受重大损失的。根据《刑法》，该违法行为构成（ ）。","options":[{"key":"A","text":"背信损害上市公司利益罪"},{"key":"B","text":"欺诈发行证券罪"},{"key":"C","text":"操纵证券、期货市场罪"},{"key":"D","text":"擅自发行股票、公司、企业债券罪"}],"answer":"A","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/背信损害上市公司利益罪","category":"通用类","difficulty":"适中","qid":"FD2106-5210","analysis":"本题考察背信损害上市公司利益罪的认定。《刑法》第169条之一：上市公司董监高违背忠实义务，利用职务便利操纵上市公司无偿向其他单位提供资金等，致使公司利益遭受重大损失的，构成\"背信损害上市公司利益罪\"。A正确。","important":false},{"number":184,"type":"单选题","stem":"根据《刑法》，（ ）违背对公司的忠实义务，利用职务便利，操纵上市公司无正当理由放弃债权、承担债务，致使上市公司利益遭受重大损失的，构成背信损害上市公司利益罪。","options":[{"key":"A","text":"上市公司员工"},{"key":"B","text":"上市公司的董事、高级管理人员"},{"key":"C","text":"上市公司监管部门及人员"},{"key":"D","text":"上市公司所在交易所及人员"}],"answer":"B","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/背信损害上市公司利益罪","category":"通用类","difficulty":"较易","qid":"FD2109-2529","analysis":"本题考察背信损害上市公司利益罪的主体。B正确，《刑法》第169条之一：犯罪主体为\"上市公司的董事、高级管理人员\"。","important":false},{"number":185,"type":"单选题","stem":"根据《刑法》，上市公司的董事、高级管理人员违背对公司的（ ），利用职务便利，操纵上市公司无偿向其他单位或者个人提供资金、商品、服务或者其他资产，致使上市公司利益遭受重大损失的，构成背信损害上市公司利益罪。","options":[{"key":"A","text":"忠实义务"},{"key":"B","text":"勤勉义务"},{"key":"C","text":"诚信义务"},{"key":"D","text":"受托义务"}],"answer":"A","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/背信损害上市公司利益罪","category":"通用类","difficulty":"较易","qid":"FD2109-3685","analysis":"本题考察背信损害上市公司利益罪中违背的义务类型。A正确，《刑法》第169条之一：要求违背对公司的\"忠实义务\"。","important":false},{"number":186,"type":"单选题","stem":"根据《刑法》，下列关于背信损害上市公司利益罪的说法，错误的是（ ）。","options":[{"key":"A","text":"该罪的犯罪主体仅为上市公司的董事及高级管理人员"},{"key":"B","text":"上市公司的控股股东指使上市公司董事实施背信损害上市公司利益罪犯罪行为的，按背信损害上市公司利益罪的规定处罚"},{"key":"C","text":"上市公司的董事违背对公司的忠实义务，利用职务便利，操纵上市公司向明显不具有清偿能力的单位或者个人提供资金构成该罪"},{"key":"D","text":"犯该罪的上市公司的实际控制人是单位的，实行“双罚制”"}],"answer":"A","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/背信损害上市公司利益罪","category":"通用类","difficulty":"较易","qid":"FD2109-6415","analysis":"本题考察背信损害上市公司利益罪的犯罪主体范围。A项错误，该罪主体不仅包括上市公司董监高，还包括控股股东或实控人指使实施的情形。B/C/D均正确。","important":false},{"number":187,"type":"单选题","stem":"根据《刑法》，下列关于操纵证券、期货市场罪的法律责任的说法，错误的是（ ）。","options":[{"key":"A","text":"情节严重的，可单处罚金"},{"key":"B","text":"情节严重的，可处五年以下有期徒刑或者拘役，并处罚金"},{"key":"C","text":"情节特别严重的，处五年以上十年以下有期徒刑，并处罚金"},{"key":"D","text":"单位犯该罪的，对单位判处罚金，其直接负责的主管人员和其他直接责任人员无需承担法律责任"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/破坏金融管理秩序罪各项罪行","category":"通用类","difficulty":"适中","qid":"FD2107-1656","analysis":"本题考察操纵证券、期货市场罪的法律责任。D项错误，《刑法》第182条：单位犯该罪的，对单位判处罚金，并对其直接负责的主管人员和其他直接责任人员依照该罪规定处罚（双罚制）。A/B/C均正确。","important":false},{"number":188,"type":"单选题","stem":"根据《刑法》，单位犯内幕交易罪的，对单位判处罚金，并对（ ）处五年以下有期徒刑或者拘役。","options":[{"key":"A","text":"法定代表人和直接责任人员"},{"key":"B","text":"董事会秘书和直接责任人员"},{"key":"C","text":"直接负责的主管人员和其他直接责任人员"},{"key":"D","text":"法定代表人和直接负责的主管人员"}],"answer":"C","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/破坏金融管理秩序罪各项罪行","category":"通用类","difficulty":"较易","qid":"FD2107-6817","analysis":"本题考察单位犯内幕交易罪的处罚。《刑法》第180条：对单位判处罚金，并对\"直接负责的主管人员和其他直接责任人员\"处5年以下有期徒刑或拘役。C正确。","important":false},{"number":189,"type":"单选题","stem":"根据《刑法》，下列关于破坏金融管理秩序罪的说法，错误的是（ ）。","options":[{"key":"A","text":"非法吸收公众存款或者变相吸收公众存款，扰乱金融秩序的主体，在提起公诉前积极退赃退赔，减少损害结果发生的，应当从轻或者减轻处罚"},{"key":"B","text":"只有明知是伪造的货币而使用且数额较大的，才构成使用假币罪"},{"key":"C","text":"单位犯擅自发行股票、公司、企业债券罪的，实行“双罚制”"},{"key":"D","text":"以自己为交易对象，自买自卖期货合约，影响证券、期货交易量，情节严重的，构成操纵证券、期货市场罪"}],"answer":"A","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/破坏金融管理秩序罪各项罪行","category":"通用类","difficulty":"适中","qid":"FD2109-3930","analysis":"本题考察破坏金融管理秩序罪。A项错误，《刑法》第176条：非法吸收公众存款，提起公诉前积极退赃退赔的，\"可以\"（而非应当）从轻或减轻处罚。B/C/D均正确。","important":false},{"number":190,"type":"单选题","stem":"根据《刑法》，下列不构成内幕交易、泄露内幕信息罪、利用未公开信息交易罪的情形是（ ）。","options":[{"key":"A","text":"证券、期货交易内幕信息的知情人员在涉及证券的发行等对证券、期货交易价格有重大影响的信息尚未公开前，买入或者卖出该证券，情节严重的"},{"key":"B","text":"非法获取证券、期货交易内幕信息的人员，在涉及证券、期货交易有重大影响的信息尚未公开前，明示、暗示他人从事上述交易活动，情节严重的"},{"key":"C","text":"证券交易所的从业人员，利用因职务便利获取的内幕信息以外的其他未公开的信息，违反规定，明示、暗示他人从事相关交易活动，情节严重的"},{"key":"D","text":"与他人串通，以事先约定的时间、价格和方式相互进行证券、期货交易，情节严重的"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/破坏金融管理秩序罪各项罪行","category":"通用类","difficulty":"适中","qid":"FD2109-8198","analysis":"本题考察内幕交易罪的排除。D\"与他人串通以约定时间、价格相互交易\"属于\"操纵证券、期货市场罪\"，而非内幕交易罪。A/B/C分别属于内幕交易和利用未公开信息交易罪。","important":false},{"number":191,"type":"单选题","stem":"根据《刑法》，不属于票据诈骗罪的是（ ）。","options":[{"key":"A","text":"明知是伪造、变造的汇票、本票、支票而使用"},{"key":"B","text":"明知是作废的汇票、本票、支票而使用"},{"key":"C","text":"冒用他人的汇票、本票、支票"},{"key":"D","text":"使用伪造、变造的委托收款凭证、汇款凭证、银行存单等其他银行结算凭证"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/金融诈骗罪各项罪行","category":"通用类","difficulty":"较易","qid":"FD2109-1097","analysis":"本题考察票据诈骗罪的排除。D\"使用伪造、变造的委托收款凭证、汇款凭证等\"属于\"金融凭证诈骗罪\"，而非票据诈骗罪。A/B/C均属于《刑法》第194条的票据诈骗行为。","important":false},{"number":192,"type":"单选题","stem":"根据《刑法》，金融诈骗罪不包括（ ）。","options":[{"key":"A","text":"集资诈骗罪"},{"key":"B","text":"贷款诈骗罪"},{"key":"C","text":"票据诈骗罪"},{"key":"D","text":"合同诈骗罪"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/金融诈骗罪各项罪行","category":"通用类","difficulty":"较易","qid":"FD2109-5897","analysis":"本题考察金融诈骗罪的类型。D\"合同诈骗罪\"属于扰乱市场秩序罪，而非金融诈骗罪。A集资诈骗罪、B贷款诈骗罪、C票据诈骗罪均属于金融诈骗罪。","important":false},{"number":193,"type":"单选题","stem":"根据《刑法》，不属于贷款诈骗罪作案手法的是（ ）。","options":[{"key":"A","text":"编造引进资金、项目等虚假理由"},{"key":"B","text":"使用虚假的经济合同"},{"key":"C","text":"使用虚假的证明文件"},{"key":"D","text":"请第三方为其提供担保"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/金融诈骗罪各项罪行","category":"通用类","difficulty":"较易","qid":"FD2109-9622","analysis":"本题考察贷款诈骗罪作案手法的排除。D\"请第三方提供担保\"是正常贷款增信措施。《刑法》第193条规定的贷款诈骗手法包括：编造虚假理由、使用虚假经济合同、使用虚假证明文件等。","important":false},{"number":194,"type":"单选题","stem":"根据《刑法》，下列关于逃税罪的说法，正确的是（ ）。","options":[{"key":"A","text":"犯罪主体只包括纳税人"},{"key":"B","text":"补缴应纳税款，缴纳滞纳金，已受行政处罚的，仍追究刑事责任，但可从轻处罚"},{"key":"C","text":"对多次实施逃税行为，未经处理的，按照最高数额计算"},{"key":"D","text":"以暴力、威胁方法拒不缴纳税款的不构成逃税罪"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/危害税收征管罪各项罪行","category":"通用类","difficulty":"适中","qid":"FD2109-3089","analysis":"本题考察逃税罪的综合规定。D正确，以暴力、威胁方法拒不缴纳税款构成\"抗税罪\"而非逃税罪。A错误（主体包括纳税人和扣缴义务人）；B错误（符合条件的可不追究刑责）；C错误（应累计计算）。","important":false},{"number":195,"type":"单选题","stem":"根据《刑法》，以暴力、威胁方法拒不缴纳税款的构成（ ）。","options":[{"key":"A","text":"逃税罪"},{"key":"B","text":"抗税罪"},{"key":"C","text":"逃避追缴欠税罪"},{"key":"D","text":"偷税罪"}],"answer":"B","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/危害税收征管罪各项罪行","category":"通用类","difficulty":"较易","qid":"FD2109-5832","analysis":"本题考察抗税罪的认定。《刑法》第202条：以暴力、威胁方法拒不缴纳税款的，构成\"抗税罪\"。B正确。A逃税罪是欺骗隐瞒手段；C逃避追缴欠税罪是转移隐匿财产。","important":false},{"number":196,"type":"单选题","stem":"《刑法》规定，向国家工作人员介绍贿赂，情节严重的，处（ ）或者拘役，并处罚金。","options":[{"key":"A","text":"三年以下有期徒刑"},{"key":"B","text":"三年以上七年以下有期徒刑"},{"key":"C","text":"管制"},{"key":"D","text":"七年以上有期徒刑"}],"answer":"A","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/介绍贿赂罪","category":"廉洁从业类","difficulty":"适中","qid":"FD2210-0005","analysis":"本题考察介绍贿赂罪的刑罚。《刑法》第392条：情节严重的，处\"三年以下有期徒刑\"或拘役，并处罚金。A正确。","important":false},{"number":197,"type":"单选题","stem":"根据《刑法》，下列关于非国家工作人员受贿罪的说法，错误的是（ ）。","options":[{"key":"A","text":"该罪的犯罪主体为公司、企业或者其他单位的工作人员"},{"key":"B","text":"行为表现为利用职务上的便利，索取他人财物或者非法收受他人财物，为他人谋取利益"},{"key":"C","text":"只要实施了相关行为即构成该罪"},{"key":"D","text":"公司工作人员在经济往来中，利用职务上的便利，违反国家规定，收受回扣归个人所有的，数额较大的，构成该罪"}],"answer":"C","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/非国家工作人员受贿罪","category":"通用类","difficulty":"适中","qid":"FD2109-3016","analysis":"本题考察非国家工作人员受贿罪。C项错误，并非只要实施行为就构成，还须满足利用职务便利+索取或收受财物+为他人谋利+数额较大等条件。A/B/D均正确。","important":false},{"number":198,"type":"单选题","stem":"根据《刑法》，公司、企业或者其他单位的工作人员在经济往来中，利用职务上的便利，违反国家规定，收受各种名义的回扣、手续费，归个人所有，数额较大的，（ ）。","options":[{"key":"A","text":"不构成犯罪"},{"key":"B","text":"构成职务侵占罪"},{"key":"C","text":"构成非法牟利罪"},{"key":"D","text":"构成非国家工作人员受贿罪"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/非国家工作人员受贿罪","category":"通用类","difficulty":"较易","qid":"FD2109-4059","analysis":"本题考察非国家工作人员受贿罪的认定。《刑法》第163条第2款：收受回扣、手续费归个人所有的，构成\"非国家工作人员受贿罪\"。D正确。","important":false},{"number":199,"type":"单选题","stem":"根据《刑法》，公司的工作人员，利用职务上的便利，索取他人财物或者非法收受他人财物，为他人谋取利益，数额较大的，构成（ ）。","options":[{"key":"A","text":"职务侵占罪"},{"key":"B","text":"受贿罪"},{"key":"C","text":"非法牟利罪"},{"key":"D","text":"非国家工作人员受贿罪"}],"answer":"D","knowledge":"一、法律/4.中华人民共和国刑法（1979年7月6日公布，2023年12月29日最新修正，2024年3月1日起施行）/非国家工作人员受贿罪","category":"通用类","difficulty":"适中","qid":"FD2109-4757","analysis":"本题考察非国家工作人员受贿罪的基本构成。《刑法》第163条第1款：公司工作人员利用职务便利索取财物或非法收受财物 },{"key":"D","text":"为拓展业务，金融机构可以为客户开立匿名账户或者假名账户"}],"answer":"C","knowledge":"一、法律/5.中华人民共和国反洗钱法（2006年10月31日公布，2024年11月8日最新修订，2025年1月1日起施行）/反洗钱义务规定","category":"通用类","difficulty":"较易","qid":"FD2406-0004","analysis":"本题考察金融机构反洗钱合规操作。C正确，《反洗钱法》第15条：可通过反洗钱行政主管部门及公安、市监、税务等部门核实客户信息。A错误（还需核验代理人）；B错误（受益人也需核验）；D错误（不得开立匿名或假名账户）。\n第一部分 法律——公务员法/公职人员政务处分法\n共5题","important":false},{"number":204,"type":"单选题","stem":"《公务员法》规定，公务员辞去公职或退休的，原系领导成员、县处级以上领导职务的公务员在离职（ ）内，其他公务员在离职（ ）内，不得到与原工作单位业务直接相关的企业或者其他营利性组织任职，不得从事与原工作业务直接相关的营利性活动。","options":[{"key":"A","text":"二年 一年"},{"key":"B","text":"三年 一年"},{"key":"C","text":"三年 二年"},{"key":"D","text":"五年 三年"}],"answer":"C","knowledge":"一、法律/6.中华人民共和国公务员法（2005年4月27日公布，2018年12月29日最新修订，2019年6月1日起施行）/任职回避规定","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0031","analysis":"本题考察公务员离职后的从业限制期限。《公务员法》第107条：领导成员/县处级以上\"3年\"内，其他公务员\"2年\"内，不得从事直接相关的营利性活动。C正确。","important":false},{"number":205,"type":"单选题","stem":"《公职人员政务处分法》规定，向公职人员及其特定关系人赠送可能影响公正行使公权力的礼品、礼金、有价证券等财物，或者接受、提供可能影响公正行使公权力的宴请、旅游、健身、娱乐等活动安排，情节较重的，予以警告、记过或者记大过；情节严重的，予以（ ）。","options":[{"key":"A","text":"开除"},{"key":"B","text":"诫勉谈话"},{"key":"C","text":"降级或者撤职"},{"key":"D","text":"党内通报"}],"answer":"C","knowledge":"一、法律/7.中华人民共和国公职人员政务处分法（2020年6月20日公布，2020年7月1日起施行）/公职人员政务处分","category":"廉洁从业类","difficulty":"适中","qid":"FD2210-0029","analysis":"本题考察公职人员政务处分。《公职人员政务处分法》第34条：情节严重的，予以\"降级或者撤职\"。C正确。","important":false},{"number":206,"type":"单选题","stem":"《公职人员政务处分法》规定，有下列行为之一，情节较重的，予以警告、记过或者记大过；情节严重的，予以降级或者（ ）：（一）违反规定向管理服务对象收取、摊派财物的；（二）在管理服务活动中故意刁难、吃拿卡要的；（三）在管理服务活动中态度恶劣粗暴，造成不良后果或者影响的；（四）不按照规定公开工作信息，侵犯管理服务对象知情权，造成不良后果或者影响的；（五）其他侵犯管理服务对象利益的行为，造成不良后果或者影响的。","options":[{"key":"A","text":"撤职"},{"key":"B","text":"诫勉谈话"},{"key":"C","text":"开除"},{"key":"D","text":"党内通报"}],"answer":"A","knowledge":"一、法律/7.中华人民共和国公职人员政务处分法（2020年6月20日公布，2020年7月1日起施行）/公职人员政务处分","category":"廉洁从业类","difficulty":"适中","qid":"FD2210-0030","analysis":"本题考察公职人员侵犯管理服务对象利益的处分。《公职人员政务处分法》第38条：情节严重的，予以\"降级或者撤职\"。A正确。","important":false},{"number":207,"type":"单选题","stem":"根据《中国共产党廉洁自律准则》，党员领导干部应当廉洁从政，自觉保持人民公仆本色；（ ），自觉维护人民根本利益；廉洁修身，自觉提升思想道德境界；廉洁齐家，自觉带头树立良好家风。","options":[{"key":"A","text":"廉洁自律"},{"key":"B","text":"廉洁用权"},{"key":"C","text":"廉洁慎行"},{"key":"D","text":"廉洁从业"}],"answer":"B","knowledge":"二、党内法规/1.中国共产党廉洁自律准则（2015年10月18日发布，2016年1月1日起施行）/廉洁自律要求","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0021","analysis":"本题考察党员领导干部廉洁自律规范。《中国共产党廉洁自律准则》规定：廉洁从政→廉洁用权→廉洁修身→廉洁齐家。B\"廉洁用权\"正确。","important":false},{"number":208,"type":"单选题","stem":"根据《中国共产党廉洁自律准则》，下列关于党员应当廉洁自律的相关说法，错误的是（ ）。","options":[{"key":"A","text":"坚持公私分明，先公后私，克己奉公"},{"key":"B","text":"坚持崇廉拒腐，清白做人，干净做事"},{"key":"C","text":"坚持尚俭戒奢，艰苦朴素，勤俭节约"},{"key":"D","text":"坚持享受在前，吃苦在后，甘于奉献"}],"answer":"D","knowledge":"二、党内法规/1.中国共产党廉洁自律准则（2015年10月18日发布，2016年1月1日起施行）/廉洁自律要求","category":"廉洁从业类","difficulty":"较难","qid":"FD2312-0001","analysis":"本题考察党员廉洁自律规范。D项错误，应为\"吃苦在前，享受在后\"，而非\"享受在前\"。《中国共产党廉洁自律准则》明确要求党员：公私分明、崇廉拒腐、尚俭戒奢、吃苦在前。","important":false},{"number":209,"type":"单选题","stem":"《关于新形势下党内政治生活的若干准则》（简称《准则》）指出，办好中国的事情，关键在党，关键在党要管党、从严治党。党要管党必须从党内政治生活管起，从严治党必须从党内政治生活严起。《准则》要求全体党员应当坚定理想信念、坚持党的基本路线、坚决维护党中央权威、严明党的政治纪律、保持党同人民群众的血肉联系、坚持民主集中制原则、发扬党内民主和保障党员权利、坚持正确选人用人导向、严格党的组织生活制度、开展批评和自我批评、加强对权力运行的制约和监督、保持（ ）。","options":[{"key":"A","text":"遵规守矩的政治自觉"},{"key":"B","text":"崇德修身的党员本色"},{"key":"C","text":"清正廉洁的政治本色"},{"key":"D","text":"干事创业的磅礴热情"}],"answer":"C","knowledge":"二、党内法规/2.关于新形势下党内政治生活的若干准则（2016年10月27日发布并施行）/党内政治生活准则","category":"廉洁从业类","difficulty":"适中","qid":"FD2210-0022","analysis":"本题考察党内政治生活准则。《关于新形势下党内政治生活的若干准则》要求保持\"清正廉洁的政治本色\"。C正确。","important":false},{"number":210,"type":"单选题","stem":"《关于新形势下党内政治生活的若干准则》要求，党员领导干部特别是高级干部必须加强自律、慎独慎微，自觉检查和及时纠正在行使权力、廉政勤政方面存在的问题，做到可以行使的权力按规则正确行使，该由上级组织行使的权力下级组织不能行使，该由（ ），不该由自己行使的权力决不能行使。","options":[{"key":"A","text":"班子成员个人行使的权力不得由领导班子集体行使"},{"key":"B","text":"领导班子集体行使的权力班子成员个人不能擅自行使"},{"key":"C","text":"下级组织行使的权力上级组织不能行使"},{"key":"D","text":"同级组织共同行使的权力个别组织不能擅自行使"}],"answer":"B","knowledge":"二、党内法规/2.关于新形势下党内政治生活的若干准则（2016年10月27日发布并施行）/党内政治生活准则","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0023","analysis":"本题考察党内政治生活准则中权力行使原则。B正确：\"该由领导班子集体行使的权力班子成员个人不能擅自行使\"。","important":false},{"number":211,"type":"单选题","stem":"根据《中国共产党纪律处分条例》，借用管理和服务对象的钱款、住房、车辆等，影响公正执行公务，情节较重的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务、留党察看或者开除党籍处分。通过（ ）等金融活动获取大额回报，影响公正执行公务的，依照前款规定处理。","options":[{"key":"A","text":"有偿使用"},{"key":"B","text":"民间借贷"},{"key":"C","text":"共同投资"},{"key":"D","text":"股权投资"}],"answer":"B","knowledge":"二、党内法规/3.中国共产党纪律处分条例（2003年12月31日发布，2023年12月8日最新修订，2024年1月1日起施行）/中国共产党纪律处分规定","category":"廉洁从业类","difficulty":"较难","qid":"FD2210-0024","analysis":"本题考察借用管理服务对象钱款的处分。《纪律处分条例》第99条：通过\"民间借贷\"等金融活动获取大额回报，影响公正执行公务的，依照借用钱款的规定处理。B正确。","important":false},{"number":212,"type":"单选题","stem":"根据《中国共产党纪律处分条例》，利用职权或者职务上的影响操办婚丧喜庆事宜，造成不良影响的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务处分；（ ）或者有其他侵犯国家、集体和人民利益行为的，从重或者加重处分，直至开除党籍。","options":[{"key":"A","text":"借机敛财"},{"key":"B","text":"以不合理低价使用管理对象场地、车辆"},{"key":"C","text":"无偿占用管理对象场地、车辆"},{"key":"D","text":"以不合理低价使用本单位场地、车辆"}],"answer":"A","knowledge":"二、党内法规/3.中国共产党纪律处分条例（2003年12月31日发布，2023年12月8日最新修订，2024年1月1日起施行）/中国共产党纪律处分规定","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0025","analysis":"本题考察操办婚丧喜庆事宜中从重处分的情形。《纪律处分条例》第100条：\"借机敛财\"的从重或加重处分直至开除党籍。A正确。","important":false},{"number":213,"type":"单选题","stem":"根据《中国共产党纪律处分条例》，接受、（ ）可能影响公正执行公务的宴请或者旅游、健身、娱乐等活动安排，情节较重的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务或者留党察看处分。","options":[{"key":"A","text":"替他人隐瞒"},{"key":"B","text":"替他人安排"},{"key":"C","text":"提供"},{"key":"D","text":"建议他人提供"}],"answer":"C","knowledge":"二、党内法规/3.中国共产党纪律处分条例（2003年12月31日发布，2023年12月8日最新修订，2024年1月1日起施行）/中国共产党纪律处分规定","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0026","analysis":"本题考察接受、提供可能影响公正执行公务的活动安排。《纪律处分条例》第101条：\"接受、提供\"可能影响公正执行公务的活动安排，情节严重的给予党纪处分。C\"提供\"正确。","important":false},{"number":214,"type":"单选题","stem":"根据《中国共产党纪律处分条例》，违反有关规定取得、持有、（ ）运动健身卡、会所和俱乐部会员卡、高尔夫球卡等各种消费卡（券），或者违反有关规定出入私人会所，情节较重的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务或者留党察看处分。","options":[{"key":"A","text 行）/保荐机构尽职推荐的保荐职责","category":"通用类","difficulty":"适中","qid":"FD2106-9266","analysis":"本题考察保荐机构的权利范围（排除项）。C\"对发行人违法违规事项发表公开谴责\"不属于保荐机构权利，保荐机构只能发表\"公开声明\"。谴责是交易所或证监会的权力。A/B/D均属于保荐机构的权利。","important":false},{"number":247,"type":"单选题","stem":"根据《证券发行上市保荐业务管理办法》，保荐机构辅导工作完成后，应由（ ）证监会派出机构进行辅导验收。","options":[{"key":"A","text":"保荐机构所在地"},{"key":"B","text":"发行人所在地"},{"key":"C","text":"发行人上市地"},{"key":"D","text":"保荐代表人所在地"}],"answer":"B","knowledge":"五、规章及部门文件/1.证券发行上市保荐业务管理办法（2020年6月12日公布，2025年3月27日修订并施行）/保荐机构尽职推荐的保荐职责","category":"通用类","difficulty":"较易","qid":"FD2109-1268","analysis":"本题考察辅导验收的负责机构。《保荐办法》第27条：由\"发行人所在地\"的证监会派出机构进行辅导验收。B正确。","important":false},{"number":248,"type":"单选题","stem":"根据《证券发行上市保荐业务管理办法》，保荐机构在推荐发行人首次公开发行股票并上市前，应当对发行人进行辅导。下列不属于接受辅导范围的人员是（ ）。","options":[{"key":"A","text":"发行人的董事、监事"},{"key":"B","text":"发行人的副总经理、董事会秘书"},{"key":"C","text":"持有发行人3%股份的股东"},{"key":"D","text":"发行人的实际控制人或者其法定代表人"}],"answer":"C","knowledge":"五、规章及部门文件/1.证券发行上市保荐业务管理办法（2020年6月12日公布，2025年3月27日修订并施行）/保荐机构尽职推荐的保荐职责","category":"通用类","difficulty":"较易","qid":"FD2109-7997","analysis":"本题考察接受辅导的人员范围（排除项）。C\"持有发行人3%股份的股东\"不属于辅导对象。接受辅导的人员包括董监高、持有\"5%以上\"股份的股东和实控人。","important":false,"lecture":true},{"number":249,"type":"单选题","stem":"下列关于更换保荐机构相关要求的说法，错误的是（ ）。","options":[{"key":"A","text":"持续督导期间，保荐机构被撤销保荐业务资格的，发行人应当在1个月内另行聘请保荐机构，未在规定期限内另行聘请的，中国证监会可以责令暂停其股票交易直至完成保荐机构更换"},{"key":"B","text":"另行聘请的保荐机构应当完成原保荐机构未完成的持续督导工作"},{"key":"C","text":"因原保荐机构被撤销保荐业务资格而另行聘请保荐机构的，另行聘请的保荐机构持续督导的时间不得少于1个完整的会计年度"},{"key":"D","text":"另行聘请的保荐机构应当自保荐协议签订之日起开展保荐工作并承担相应的责任"}],"answer":"A","knowledge":"五、规章及部门文件/1.证券发行上市保荐业务管理办法（2020年6月12日公布，2025年3月27日修订并施行）/保荐机构尽职推荐的保荐业务规程","category":"通用类","difficulty":"适中","qid":"FD2109-0741","analysis":"本题考察更换保荐机构的规定。A项错误，保荐机构被撤销资格后，发行人应在1个月内另行聘请，逾期未聘请的，证监会可责令\"限期\"更换。B/C/D均正确。","important":false},{"number":250,"type":"单选题","stem":"根据《证券发行上市保荐业务管理办法》，企业首次公开发行股票并上市，下列人员不属于应当在证券发行保荐书上签字的是（ ）。","options":[{"key":"A","text":"保荐机构法定代表人"},{"key":"B","text":"保荐机构保荐业务负责人"},{"key":" ","analysis":"本题考察主板IPO稳定运行要求期限。C正确，主板要求最近\"3年\"内主营业务和董高无重大变化，实控人不变。","important":false,"lecture":true},{"number":272,"type":"单选题","stem":"根据《首次公开发行股票注册管理办法》，下列关于首次公开发行股票并上市的发行程序的说法，错误的是（ ）。","options":[{"key":"A","text":"发行人高级管理人员就本次股票发行的具体方案、本次募集资金使用的可行性及其他必须明确的事项作出决议"},{"key":"B","text":"发行人股东会就本次发行股票的种类和数量作出决议"},{"key":"C","text":"发行人应当按照中国证监会的有关规定制作注册申请文件"},{"key":"D","text":"注册申请文件受理后，未经中国证监会或者交易所同意，不得改动"}],"answer":"A","knowledge":"五、规章及部门文件/5.首次公开发行股票注册管理办法（2023年2月17日公布并施行）/首次公开发行股票并上市的发行程序","category":"主板类","difficulty":"适中","qid":"FD2109-3232","analysis":"本题考察发行程序中的决策主体。A项错误，应为\"发行人董事会\"就发行具体方案作出决议，而非高级管理人员。B/C/D均正确。","important":false,"lecture":true},{"number":273,"type":"单选题","stem":"根据《首次公开发行股票注册管理办法》，关于发行人股东会应就本次发行股票作出的决议事项，下列说法错误的是（ ）。","options":[{"key":"A","text":"本次发行股票的种类和数量"},{"key":"B","text":"发行前滚存利润的分配方案"},{"key":"C","text":"募集资金用途"},{"key":"D","text":"对总经理办理本次发行具体事宜的授权"}],"answer":"D","knowledge":"五、规章及部门文件/5.首次公开发行股票注册管理办法（2023年2月17日公布并施行）/首次公开发行股票并上市的发行程序","category":"主板类","difficulty":"适中","qid":"FD2109-9777","analysis":"本题考察股东会应决议事项（排除项）。D\"对总经理办理发行事宜的授权\"不属于股东会决议事项，应为对\"董事会\"的授权。A/B/C均属于。","important":false,"lecture":true},{"number":274,"type":"单选题","stem":"根据《首次公开发行股票注册管理办法》，交易所认为发行人不符合发行条件或者信息披露要求，作出终止发行上市审核决定，或者中国证监会作出不予注册决定的，自决定作出之日起（ ）个月后，发行人可以再次提出公开发行股票并上市申请。","options":[{"key":"A","text":"3"},{"key":"B","text":"6"},{"key":"C","text":"24"},{"key":"D","text":"12"}],"answer":"B","knowledge":"五、规章及部门文件/5.首次公开发行股票注册管理办法（2023年2月17日公布并施行）/首次公开发行股票并上市的发行程序","category":"主板类","difficulty":"适中","qid":"FD2106-5291","analysis":"本题考察终止审核后重新申请的期限。B正确，自作出终止决定之日起\"6个月\"后可再次提出申请。","important":false,"lecture":true},{"number":275,"type":"单选题","stem":"根据《首次公开发行股票注册管理办法》，下列关于首次公开发行股票并上市招股说明书的说法，错误的是（ ）。","options":[{"key":"A","text":"招股说明书中引用经审计的财务报表在其最近一期截止日后6个月内有效，特殊情况下可以适当延长，但至多不超过3个月"},{"key":"B","text":"招股说明书的有效期为6个月，自交易所收到发行申请文件之日起计算"},{"key":"C","text":"交易所受理注册申请文件后，发行人应当将招股说明书在交易所网站预先披露"},{"key":"D","text":"发行人及其全体董事、监事和高级管理人员应当保证招股说明书的内容真实、准确、 t":false},{"number":370,"type":"单选题","stem":"《关于加强注册制下中介机构廉洁从业监管的意见》规定，证券公司应当对从业人员加强廉洁培训和教育，建立健全廉洁从业承诺制度，树立全员廉洁从业理念，培育廉洁从业文化。证券公司应当对从业人员廉洁从业情况进行定期考察和评估，并将评估结果作为人员聘用、晋升、离任、薪酬等事项的重要考量因素。从业人员因廉洁从业问题被开除或辞退的，或被证监会系统以外单位追责的，证券公司得知情况后应当及时向（ ）报告。","options":[{"key":"A","text":"中国证券业协会"},{"key":"B","text":"证监会有关部门"},{"key":"C","text":"公司所在地证监局"},{"key":"D","text":"申报项目在审交易所"}],"answer":"C","knowledge":"五、规章及部门文件/17.关于加强注册制下中介机构廉洁从业监管的意见（2022年5月31日公布并施行）/廉洁从业报告义务","category":"廉洁从业类","difficulty":"适中","qid":"FD2210-0013","analysis":"本题考察报告义务。C正确，证券公司得知后应当及时向\"公司所在地证监局\"报告。","important":false},{"number":371,"type":"单选题","stem":"《关于加强注册制下中介机构廉洁从业监管的意见》规定，证券公司应当建立科学合理的激励约束机制和内部问责机制，（ ）将从业人员薪酬收入与其承做或承揽的项目收入直接挂钩，（ ）以业务包干等过度激励方式开展投资银行业务，应当在劳动合同、内部制度中明确，对存在廉洁从业违法违规行为的从业人员，可采取要求其退还与违规行为相关的全部或部分奖金，或者停止对其实施长效激励措施等问责措施。会计师事务所、律师事务所等其他中介机构参照执行。","options":[{"key":"A","text":"不得，不得"},{"key":"B","text":"可以，不得"},{"key":"C","text":"不得，可以"},{"key":"D","text":"可以，可以"}],"answer":"A","knowledge":"五、规章及部门文件/17.关于加强注册制下中介机构廉洁从业监管的意见（2022年5月31日公布并施行）/激励约束机制和内部问责机制","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0014","analysis":"本题考察廉洁从业激励约束机制。A正确，\"不得\"将薪酬收入与项目收入直接挂钩，\"不得\"以业务包干等过度激励方式开展投行业务。","important":false},{"number":372,"type":"单选题","stem":"《关于加强注册制下中介机构廉洁从业监管的意见》规定，证券公司应当加强（ ）审查，将审查机制贯穿投资银行业务全流程，对从业人员及其配偶、利害关系人是否存在违规从事证券、基金和未上市企业股权投资的情形进行审查，建立健全回避制度并严格执行，从源头上防范廉洁从业风险。会计师事务所、律师事务所等其他中介机构参照执行。","options":[{"key":"A","text":"利益冲突"},{"key":"B","text":"质量控制"},{"key":"C","text":"交易安全"},{"key":"D","text":"保密风险"}],"answer":"A","knowledge":"五、规章及部门文件/17.关于加强注册制下中介机构廉洁从业监管的意见（2022年5月31日公布并施行）/利益冲突审查","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0015","analysis":"本题考察投行业务全流程的审查类型。A正确，应当加强\"利益冲突\"审查。","important":false},{"number":373,"type":"单选题","stem":"《关于加强注册制下中介机构廉洁从业监管的意见》规定，证券公司及其从业人员在从事投资银行业务过程中，应当遵循证监会及交易所有关沟通交往规定，不得以不正当方式（ ）、指使、协助他人干预影响审核，不得在项目申报、审核、注册过程中通过利益输送、行贿等方式“围猎”监管审核人员，不得利用证监会系统在职人员或离职人员及其近亲属等关系或身份谋取不正当利益。会计师事务所、律师事务所等其他中介机构参照执行。","options":[{"key":"A","text":"教唆"},{"key":"B","text":"劝止"},{"key":"C","text":"宣扬"},{"key":"D","text":"隐瞒"}],"answer":"A","knowledge":"五、规章及部门文件/17.关于加强注册制下中介机构廉洁从业监管的意见（2022年5月31日公布并施行）/廉洁从业禁止行为(1)","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0016","analysis":"本题考察廉洁从业禁止行为。A正确，不得以不正当方式\"教唆\"、指使、协助他人干预影响审核。","important":false},{"number":374,"type":"单选题","stem":"《关于加强注册制下中介机构廉洁从业监管的意见》规定，证券公司应当严格按照《证券公司投资银行业务内部控制指引》相关要求，建立健全投资银行业务“三道防线”，充分发挥监督制衡作用。不得在项目申报、审核、发行承销过程中通过欺诈、胁迫发行人获取不正当利益，或者（ ）等违法违规行为。不得在证券发行过程中协助发行人直接或间接认购自己发行的债券，不得以返费、代持、违规配售等方式输送或谋取不正当利益。","options":[{"key":"A","text":"协助发行人获取合规审批"},{"key":"B","text":"协助发行人隐瞒财务造假"},{"key":"C","text":"协助发行人获得境外经营凭证"},{"key":"D","text":"协助发行人进行跨境结算"}],"answer":"B","knowledge":"五、规章及部门文件/17.关于加强注册制下中介机构廉洁从业监管的意见（2022年5月31日公布并施行）/廉洁从业禁止行为(1)","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0019","analysis":"本题考察廉洁从业禁止行为。B正确，不得协助发行人\"隐瞒财务造假\"。","important":false},{"number":375,"type":"单选题","stem":"《关于加强注册制下中介机构廉洁从业监管的意见》规定，证券公司在投行项目股东穿透等事项核查中，应当重点对证券公司高级管理人员和经办人员、证监会系统离职人员（ ）进行严格审查，防范突击入股、利益输送、“影子股东”、违规代持等违法违规行为；发现违法违纪线索的，应及时向公司所在地证监局报告。会计师事务所、律师事务所等其他中介机构参照执行。","options":[{"key":"A","text":"无形资产入股"},{"key":"B","text":"执业声誉信息"},{"key":"C","text":"不当入股行为"},{"key":"D","text":"执业资格证书"}],"answer":"C","knowledge":"五、规章及部门文件/17.关于加强注册制下中介机构廉洁从业监管的意见（2022年5月31日公布并施行）/不当入股行为","category":"廉洁从业类","difficulty":"适中","qid":"FD2210-0017","analysis":"本题考察不当入股行为审查。C正确，应当重点对\"不当入股行为\"进行严格审查。","important":false,"lecture":true},{"number":376,"type":"单选题","stem":"《关于加强注册制下中介机构廉洁从业监管的意见》规定，证券公司应当加强对聘请各类第三方机构和个人的廉洁风险防范，制定规范聘用第三方的制度，明确资质条件和遴选流程，确保相关聘请行为合法合规，并依据有关规定履行信息披露义务。禁止利用聘请第三方进行（ ）、商业贿赂等违法行为。","options":[{"key":"A","text":"股权代持"},{"key":"B","text":"利益输送"},{"key":"C","text":"突击入股"},{"key":"D","text":"过度推介"}],"answer":"B","knowledge":"五、规章及部门文件/17.关于加强注册制下中介机构廉洁从业监管的意见（2022年5月31日公布并施行）/聘请第三方廉洁风险防范","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0018","analysis":"本题考察聘请第三方的廉洁风险防范。B正确，禁止利用聘请第三方进行\"利益输送\"、商业贿赂等违法行为。","important":false},{"number":377,"type":"单选题","stem":"《关于加强注册制下中介机构廉洁从业监管的意见》规定，中国证监会、司法部、财政部依据相关法规加强对中介机构廉洁从业监管，对中介机构落实本规定的情况进行监督和检查。中介机构及其工作人员违反廉洁从业有关法律法规和规定的，主管部门依法采取监管措施；涉嫌违法犯罪的，移送司法部门处理，并依据有关规定向纪检监察机构转交违法违纪线索。对中介机构（ ）、主动报告、主动处理廉洁从业违法违规问题的，可依法依规从轻或减轻相关机构或人员的责任。","options":[{"key":"A","text":"主动发现"},{"key":"B","text":"主动预防"},{"key":"C","text":"主动检举"},{"key":"D","text":"主动加强制度约束"}],"answer":"A","knowledge":"五、规章及部门文件/17.关于加强注册制下中介机构廉洁从业监管的意见（2022年5月31日公布并施行）/廉洁从业监管（1）","category":"廉洁从业类","difficulty":"较易","qid":"FD2210-0020","analysis":"本题考察廉洁从业违规的从轻处理。A正确，对\"主动发现\"、主动报告、主动处理的，可依法从轻或减轻责任。","important":false},{"number":378,"type":"单选题","stem":"根据《关于加强证券公司在投资银行类业务中聘请第三方等廉洁从业风险防控的意见》，下列关于证券公司在投资银行类业务中聘请第三方的有关说法，正确的是（ ）。","options":[{"key":"A","text":"证券公司依法应当承担的责任因聘请第三方而减轻或免除"},{"key":"B","text":"证券公司合规负责人应对相关聘请事项进行合规审查并出具合规审查意见"},{"key":"C","text":"证券公司应当建立健全内控机制，可不制定规范聘用第三方的制度"},{"key":"D","text":"证券公司根据法规规定和客观需要合理使用第三方服务，可以将法定职责予以外包"}],"answer":"B","knowledge":"五、规章及部门文件/18.关于加强证券公司在投资银行类业务中聘请第三方等廉洁从业风险防控的意见（2018年6月27日公布并施行）/投行业务聘请第三方廉洁风险防范","category":"廉洁从业类","difficulty":"较易","qid":"FD2302-0030","analysis":"本题考察投行业务中聘请第三方的合规要求。B正确，合规负责人应对相关聘请事项进行合规审查并出具合规审查意见。A错误（不得因聘请第三方减轻或免除责任）；C错误（应当制定制度）；D错误（不得将法定职责外包）。","important":false},{"number":379,"type":"单选题","stem":"根据《证券期货市场诚信监督管理办法》，诚信信息记入诚信档案的人员不包括（ ）。","options":[{"key":"A","text":"证券期货市场投资者、交易者"},{"key":"B","text":"证券市场违法案件执法人员"},{"key":"C","text":"为证券期货业提供信息技术服务或者软硬件产品的供应商"},{"key":"D","text":"证券期货传播媒介机构、人员"}],"answer":"B","knowledge":"五、规章及部门文件/19.证券期货市场诚信监督管理办法（2018年3月28日公布，2020年3月20日修正并施行）/证券期货诚信信息采集、管理、公开与查询相关规定","category":"通用类","difficulty":"适中","qid":"FD2109-5628","analysis":"本题考察诚信信息记入诚信档案的人员（排除项）。B\"证券市场违法案件执法人员\"不属于诚信信息记入对象。A/C/D均属于。","important":false},{"number":380,"type":"单选题","stem":"根据《证券期货市场诚信监督管理办法》，下列关于违法失信信息效力期限的说法，错误的是（ ）。","options":[{"key":"A","text":"违法失信信息在诚信档案中的效力期限为3年或者5年"},{"key":"B","text":"超过效力期限的违法失信信息，不再进行诚信信息公开"},{"key":"C","text":"效力期限自对违法失信行为的处理决定执行完毕之日起算"},{"key":"D","text":"超过效力期限的违法失信信息可以继续接受诚信信息申请查询"}],"answer":"D","knowledge":"五、规章及部 ":"较易","qid":"FD2112-50NN","analysis":"本题考察发行人及中介机构应报告和核查的重大事项（排除项）。D\"公司购置生产设备\"不属于重大事项。A/B/C均属于。\n第六部分 自律规则\n共87题","important":false}]</script>
  <script>
    const QUESTIONS = JSON.parse(document.getElementById('quizData').textContent);
    const STATS = JSON.parse(document.getElementById('quizStats').textContent);
    const STORE_KEY = 'static_quiz_progress_v1_' + STATS.source;
    const state = {
      mode: 'sequential',
      studyMode: 'answer',
      wrongOnly: false,
      lectureOnly: false,
      exam: null,
      order: [],
      pos: 0,
      checked: false,
      selected: null,
      progress: loadProgress()
    };

    const el = (id) => document.getElementById(id);

    function loadProgress() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
        return { answers: saved.answers || {}, wrong: saved.wrong || {}, right: saved.right || {} };
      } catch {
        return { answers: {}, wrong: {}, right: {} };
      }
    }

    function saveProgress() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state.progress));
    }

    function optionHtml(question, option, forceAnswer = false) {
      const selected = state.selected === option.key ? ' selected' : '';
      let result = '';
      if (state.checked || forceAnswer) {
        if (option.key === question.answer) result = ' correct';
        else if (option.key === state.selected) result = ' wrong';
      }
      return `<button type="button" class="option${selected}${result}" data-choice="${option.key}">
        <span class="key">${option.key}</span>
        <span>${escapeHtml(option.text)}</span>
      </button>`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function fillSelect(select, values, allLabel) {
      select.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
    }

    function filteredQuestions() {
      const keyword = el('searchInput').value.trim().toLowerCase();
      const category = el('categorySelect').value;
      const difficulty = el('difficultySelect').value;
      return QUESTIONS.filter(q => {
        if (state.wrongOnly && !state.progress.wrong[q.number]) return false;
        if (state.lectureOnly && !q.lecture) return false;
        if (category && q.category !== category) return false;
        if (difficulty && q.difficulty !== difficulty) return false;
        if (!keyword) return true;
        const hay = [q.stem, q.knowledge, q.analysis, q.qid, q.category, q.difficulty, ...q.options.map(o => o.text)].join(' ').toLowerCase();
        return hay.includes(keyword);
      });
    }

    function buildOrder() {
      state.exam = null;
      const list = filteredQuestions();
      state.order = list.map(q => q.number);
      if (state.mode === 'random') {
        for (let i = state.order.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [state.order[i], state.order[j]] = [state.order[j], state.order[i]];
        }
      }
      state.pos = 0;
      state.checked = false;
      state.selected = null;
      render();
    }

    function shuffledNumbers(list) {
      const numbers = list.map(q => q.number);
      for (let i = numbers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
      }
      return numbers;
    }

    function startExam() {
      const list = filteredQuestions();
      if (!list.length) {
        alert('当前筛选没有题目，先调整筛选条件。');
        return;
      }
      const order = shuffledNumbers(list).slice(0, Math.min(100, list.length));
      state.exam = { order, answers: {}, submitted: false, startedAt: Date.now() };
      state.order = order;
      state.pos = 0;
      state.checked = false;
      state.selected = null;
      closeSettings();
      closeActionMenu();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function examScore() {
      if (!state.exam) return { right: 0, total: 0, score: 0 };
      const total = state.exam.order.length;
      const right = state.exam.order.filter(number => {
        const q = QUESTIONS.find(item => item.number === number);
        return q && state.exam.answers[number] === q.answer;
      }).length;
      return { right, total, score: right };
    }

    function finishExam() {
      if (!state.exam || state.exam.submitted) return;
      const answered = Object.keys(state.exam.answers).length;
      const total = state.exam.order.length;
      if (answered < total && !confirm(`还有 ${total - answered} 道题没有作答，确认交卷吗？`)) return;
      state.exam.submitted = true;
      const score = examScore();
      alert(`交卷完成：${score.score} / ${score.total} 分，答对 ${score.right} 题。`);
      render();
    }

    function returnFullBank() {
      state.exam = null;
      state.wrongOnly = false;
      state.lectureOnly = false;
      state.mode = 'sequential';
      state.checked = false;
      state.selected = null;
      el('searchInput').value = '';
      el('categorySelect').value = '';
      el('difficultySelect').value = '';
      state.order = QUESTIONS.map(q => q.number);
      state.pos = 0;
      closeActionMenu();
      closeSettings();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openSettings() {
      document.body.classList.add('settings-open');
    }

    function closeSettings() {
      document.body.classList.remove('settings-open');
    }

    function currentQuestion() {
      const number = state.order[state.pos];
      return QUESTIONS.find(q => q.number === number);
    }

    function render() {
      renderStats();
      renderButtons();
      const panel = el('questionPanel');
      if (!state.order.length) {
        panel.innerHTML = '<div class="empty">当前筛选没有题目。调整筛选条件后重新开始。</div>';
        return;
      }
      const q = currentQuestion();
      const isExam = Boolean(state.exam);
      const examSubmitted = isExam && state.exam.submitted;
      const saved = isExam ? { choice: state.exam.answers[q.number] } : state.progress.answers[q.number];
      if (isExam) {
        state.selected = saved.choice || null;
        state.checked = examSubmitted;
      } else if (state.studyMode === 'answer' && !state.selected && saved) {
        state.selected = saved.choice;
        state.checked = true;
      }
      const forceAnswer = state.studyMode === 'view' || examSubmitted;
      const resultText = state.checked
        ? (state.selected === q.answer ? '回答正确' : `回答错误，你选择了 ${state.selected || '未选择'}`)
        : isExam ? '考试模式：选择会自动保存，交卷后查看分数和解析' : forceAnswer ? '看答案模式' : '选择一个答案后提交';
      const checkLabel = isExam ? (examSubmitted ? '已交卷' : '交卷') : (forceAnswer ? '看答案中' : state.checked ? '已提交' : '提交答案');
      const examSummary = isExam ? examScore() : null;
      panel.innerHTML = `
        <div class="q-meta">
          <span class="pill">第 ${state.pos + 1} / ${state.order.length} 题</span>
          <span class="pill">原题号 ${q.number}</span>
          <span class="pill">${escapeHtml(q.type)}</span>
          <span class="pill">${escapeHtml(q.difficulty || '未标注难度')}</span>
          <span class="pill">${escapeHtml(q.category || '未分类')}</span>
          ${q.lecture ? '<span class="pill">讲题精选</span>' : ''}
          ${q.important ? '<span class="pill">易错重点</span>' : ''}
          ${isExam ? `<span class="pill">试卷得分 ${examSummary.score} / ${examSummary.total}</span>` : ''}
        </div>
        <div class="stem">${escapeHtml(q.stem)}</div>
        <div class="options">${q.options.map(option => optionHtml(q, option, forceAnswer)).join('')}</div>
        <div class="answer-box ${(state.checked || forceAnswer) ? 'show' : ''}">
          <p class="answer-line">${escapeHtml(resultText)}；正确答案：${escapeHtml(q.answer)}</p>
          <p class="knowledge">${escapeHtml(q.knowledge || '暂无知识点')}</p>
          <p class="knowledge">试题编号：${escapeHtml(q.qid || '-')}</p>
          ${q.analysis ? `<p class="analysis">${escapeHtml(q.analysis)}</p>` : ''}
        </div>
        <div class="nav-row">
          <button class="btn" id="prevBtn" type="button">上一题</button>
          <button class="btn primary" id="checkBtn" type="button">${checkLabel}</button>
          ${isExam ? '' : '<button class="btn" id="showAnswerBtn" type="button">本题看答案</button>'}
          ${isExam ? '<button class="btn" id="returnFullBtn" type="button">返回600题</button>' : ''}
          <span class="spacer"></span>
          <button class="btn" id="nextBtn" type="button">下一题</button>
        </div>`;
      panel.querySelectorAll('.option').forEach(btn => btn.addEventListener('click', () => choose(btn.dataset.choice)));
      el('prevBtn').addEventListener('click', prevQuestion);
      el('nextBtn').addEventListener('click', nextQuestion);
      el('checkBtn').addEventListener('click', isExam ? finishExam : checkAnswer);
      if (!isExam) el('showAnswerBtn').addEventListener('click', showAnswer);
      if (isExam) el('returnFullBtn').addEventListener('click', returnFullBank);
      renderReview();
    }

    function renderButtons() {
      el('sequentialBtn').classList.toggle('active', state.mode === 'sequential');
      el('randomBtn').classList.toggle('active', state.mode === 'random');
      el('answerModeBtn').classList.toggle('active', state.studyMode === 'answer');
      el('viewModeBtn').classList.toggle('active', state.studyMode === 'view');
      el('wrongModeBtn').classList.toggle('active', state.wrongOnly);
      el('wrongModeBtn').textContent = state.wrongOnly ? '退出错题练习' : '错题练习';
      el('lectureModeBtn').classList.toggle('active', state.lectureOnly);
      el('lectureModeBtn').textContent = state.lectureOnly ? '退出讲题精选' : '讲题精选';
    }

    function renderStats() {
      const list = state.exam ? state.exam.order.map(number => QUESTIONS.find(q => q.number === number)).filter(Boolean) : filteredQuestions();
      const answered = state.exam ? Object.keys(state.exam.answers).length : list.filter(q => state.progress.answers[q.number]).length;
      const score = state.exam ? examScore() : null;
      const right = state.exam ? score.right : list.filter(q => state.progress.right[q.number]).length;
      const wrong = Object.keys(state.progress.wrong).length;
      el('sourceInfo').textContent = `解析 ${STATS.analysisCount || 0} 题 · 讲题精选 ${STATS.lectureCount || 0} 题`;
      el('totalCount').textContent = list.length;
      el('doneCount').textContent = answered;
      el('rightRate').textContent = answered ? Math.round(right / answered * 100) + '%' : '0%';
      el('wrongCount').textContent = wrong;
      el('progressBar').style.width = list.length ? `${Math.round(answered / list.length * 100)}%` : '0%';
    }

    function renderReview() {
      const wrongNumbers = Object.keys(state.progress.wrong).map(Number).sort((a, b) => a - b);
      if (!wrongNumbers.length) {
        el('reviewList').innerHTML = '<div class="empty">还没有错题。</div>';
        return;
      }
      el('reviewList').innerHTML = wrongNumbers.map(number => {
        const q = QUESTIONS.find(item => item.number === number);
        const wrong = state.progress.wrong[number];
        return `<div class="review-item" data-number="${number}">
          <b>${number}.</b> ${escapeHtml(q.stem.slice(0, 88))}
          <div class="knowledge">你的答案：${escapeHtml(wrong.choice)}；正确答案：${escapeHtml(q.answer)}</div>
        </div>`;
      }).join('');
      el('reviewList').querySelectorAll('.review-item').forEach(item => {
        item.addEventListener('click', () => jumpToQuestion(Number(item.dataset.number)));
      });
    }

    function choose(choice) {
      if (state.exam) {
        if (state.exam.submitted) return;
        const q = currentQuestion();
        if (!q) return;
        state.selected = choice;
        state.exam.answers[q.number] = choice;
        render();
        return;
      }
      if (state.studyMode === 'view') return;
      if (state.checked) return;
      state.selected = choice;
      render();
    }

    function checkAnswer() {
      if (state.studyMode === 'view') return;
      const q = currentQuestion();
      if (!q || !state.selected || state.checked) return;
      state.checked = true;
      state.progress.answers[q.number] = { choice: state.selected, answer: q.answer, at: Date.now() };
      if (state.selected === q.answer) {
        state.progress.right[q.number] = true;
        delete state.progress.wrong[q.number];
      } else {
        delete state.progress.right[q.number];
        state.progress.wrong[q.number] = { choice: state.selected, answer: q.answer, at: Date.now() };
      }
      saveProgress();
      render();
    }

    function showAnswer() {
      const q = currentQuestion();
      if (!q) return;
      state.checked = true;
      if (!state.selected) state.selected = q.answer;
      render();
    }

    function move(delta) {
      if (!state.order.length) return;
      state.pos = Math.max(0, Math.min(state.order.length - 1, state.pos + delta));
      if (!state.exam) {
        state.checked = false;
        state.selected = null;
      }
      render();
    }
    function prevQuestion() { move(-1); }
    function nextQuestion() { move(1); }

    function jumpToQuestion(number) {
      state.exam = null;
      state.wrongOnly = false;
      const filtered = filteredQuestions().map(q => q.number);
      state.order = filtered.includes(number) ? filtered : QUESTIONS.map(q => q.number);
      state.pos = Math.max(0, state.order.indexOf(number));
      state.checked = false;
      state.selected = null;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpFromInput() {
      state.exam = null;
      const number = Number(el('jumpInput').value);
      if (!Number.isInteger(number)) return;
      const filtered = filteredQuestions().map(q => q.number);
      if (!filtered.includes(number)) {
        const exists = QUESTIONS.some(q => q.number === number);
        alert(exists ? '该题不在当前筛选范围内，请先调整筛选条件。' : '没有找到这个题号。');
        return;
      }
      state.order = filtered;
      state.pos = filtered.indexOf(number);
      state.checked = false;
      state.selected = null;
      render();
      closeSettings();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetProgress() {
      if (!confirm('确认清空本机保存的做题记录和错题吗？')) return;
      localStorage.removeItem(STORE_KEY);
      state.progress = loadProgress();
      state.checked = false;
      state.selected = null;
      render();
    }

    function setActionMenu(open) {
      el('actionMenu').classList.toggle('open', open);
    }

    function toggleActionMenu() {
      setActionMenu(!el('actionMenu').classList.contains('open'));
    }

    function closeActionMenu() {
      setActionMenu(false);
    }

    function bindEvents() {
      fillSelect(el('categorySelect'), STATS.categories, '全部分类');
      fillSelect(el('difficultySelect'), STATS.difficulties, '全部难度');
      el('menuBtn').addEventListener('click', event => { event.stopPropagation(); toggleActionMenu(); });
      el('actionMenu').addEventListener('click', event => event.stopPropagation());
      document.addEventListener('click', closeActionMenu);
      el('examBtn').addEventListener('click', startExam);
      el('returnFullMenuBtn').addEventListener('click', returnFullBank);
      el('lectureModeBtn').addEventListener('click', () => { closeActionMenu(); state.lectureOnly = !state.lectureOnly; buildOrder(); });
      el('settingsBtn').addEventListener('click', () => { closeActionMenu(); openSettings(); });
      el('closeSettingsBtn').addEventListener('click', closeSettings);
      el('settingsBackdrop').addEventListener('click', closeSettings);
      document.addEventListener('keydown', event => { if (event.key === 'Escape') closeSettings(); });
      el('startBtn').addEventListener('click', () => { buildOrder(); closeSettings(); });
      el('sequentialBtn').addEventListener('click', () => { state.mode = 'sequential'; buildOrder(); });
      el('randomBtn').addEventListener('click', () => { state.mode = 'random'; buildOrder(); });
      el('answerModeBtn').addEventListener('click', () => { state.studyMode = 'answer'; state.checked = false; state.selected = null; render(); });
      el('viewModeBtn').addEventListener('click', () => { state.studyMode = 'view'; state.checked = false; state.selected = null; render(); });
      el('jumpBtn').addEventListener('click', jumpFromInput);
      el('jumpInput').addEventListener('keydown', event => { if (event.key === 'Enter') jumpFromInput(); });
      el('wrongModeBtn').addEventListener('click', () => { state.wrongOnly = !state.wrongOnly; buildOrder(); });
      el('resetBtn').addEventListener('click', resetProgress);
      el('toggleReviewBtn').addEventListener('click', () => el('reviewPanel').classList.toggle('show'));
      ['searchInput', 'categorySelect', 'difficultySelect'].forEach(id => el(id).addEventListener('input', () => {
        state.checked = false;
        state.selected = null;
        buildOrder();
      }));
    }

    bindEvents();
    buildOrder();
  </script>
</body>
</html>
